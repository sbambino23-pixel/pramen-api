<title>prAmen — Command Center</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}::selection{background:var(--gold);color:#F2EDD8}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#CFC9AC;border-radius:3px}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;padding:14px 18px;min-height:100vh}.c{max-width:1400px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border)}.hdr h1{font-size:20px;font-weight:700;color:var(--gold)}.hdr .sub{color:var(--muted);font-size:10px;margin-top:2px;font-family:ui-monospace,'SF Mono',monospace}
.live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);font-weight:600}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px}.k{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;position:relative}.k .l{font-size:8px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}.k .v{font-size:22px;font-weight:700;font-family:ui-monospace,'SF Mono',monospace;letter-spacing:-.5px}

.delta-up{color:var(--green);background:rgba(122,138,104,.12)}.delta-down{color:var(--red);background:rgba(168,79,62,.12)}.delta-flat{color:var(--muted);background:rgba(94,60,36,.05)}

.ug{display:grid;grid-template-columns:240px 1fr;gap:10px}.ui{padding:6px 8px;border-radius:5px;margin-bottom:2px;cursor:pointer;background:rgba(94,60,36,.03);border:1px solid transparent;font-size:10px}.ui:hover{border-color:var(--border)}.ui.ac{border-color:rgba(154,104,72,.3);background:rgba(154,104,72,.08)}.ud{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px}.uid{font-family:ui-monospace,'SF Mono',monospace;font-weight:500;font-size:9px}.um{display:flex;gap:4px;font-size:7px;color:var(--muted);margin-top:2px;flex-wrap:wrap}

.el{max-height:520px;overflow-y:auto}.ei{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid rgba(94,60,36,.06)}.ed{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}.en{font-size:11px;font-weight:500}.et{font-size:8px;color:var(--muted);font-family:ui-monospace,'SF Mono',monospace}.tg{display:flex;gap:3px;margin-top:1px;flex-wrap:wrap}.tg span{font-size:8px}
/* Search */
.search-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.search-input{background:rgba(94,60,36,.04);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:11px;font-family:system-ui,-apple-system,sans-serif;outline:none;flex:1;min-width:160px}.search-input:focus{border-color:var(--gold)}.search-input::placeholder{color:var(--muted)}
.filter-chip{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:system-ui,-apple-system,sans-serif}.filter-chip:hover{border-color:var(--text);color:var(--text)}.filter-chip.on{border-color:var(--gold);color:var(--gold);background:rgba(154,104,72,.1)}

.f-step-rate{font-size:8px;color:var(--muted);text-align:center;padding:2px 0;font-family:ui-monospace,'SF Mono',monospace;opacity:.5;font-style:italic}

.br{margin-bottom:5px}.br .bl{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}.br .bn{font-weight:500}.br .bc{color:var(--muted);font-family:ui-monospace,'SF Mono',monospace;font-size:9px}.bt{height:3px;background:rgba(94,60,36,.08);border-radius:2px;overflow:hidden}.bf{height:100%;border-radius:2px}

.loading{text-align:center;padding:60px;color:var(--muted)}.err{background:rgba(168,79,62,.08);border:1px solid rgba(168,79,62,.18);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--red);font-size:11px}.note{background:rgba(154,104,72,.06);border:1px solid rgba(154,104,72,.15);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--gold);font-size:11px}
.rbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:9px;font-family:system-ui,-apple-system,sans-serif;font-weight:600}.rbtn:hover{border-color:var(--gold);color:var(--gold)}
.seg{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:7px;font-weight:700;letter-spacing:.3px}
.seg-power{background:rgba(122,138,104,.15);color:var(--green)}.seg-active{background:rgba(107,110,82,.15);color:var(--indigo)}.seg-new{background:rgba(90,138,158,.15);color:var(--blue)}.seg-dormant{background:rgba(168,79,62,.1);color:var(--red)}.seg-atrisk{background:rgba(192,112,64,.15);color:var(--orange)}
.ub{height:3px;background:rgba(94,60,36,.08);border-radius:2px;overflow:hidden;margin-top:3px;width:100%}.ubf{height:100%;border-radius:2px}
.usr-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:10px}
.usr-stat{background:rgba(94,60,36,.04);border-radius:5px;padding:6px 8px;text-align:center}.usr-stat .sv{font-size:16px;font-weight:700;font-family:ui-monospace,'SF Mono',monospace}.usr-stat .sl{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.tgap{text-align:center;padding:3px 0;color:var(--muted);font-size:8px;font-family:ui-monospace,'SF Mono',monospace;opacity:.5;font-style:italic}
.usr-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.usr-name{font-size:14px;font-weight:700;color:var(--gold);font-family:ui-monospace,'SF Mono',monospace}
.usr-meta{font-size:9px;color:var(--muted)}
.asc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600}.asc-ok{background:rgba(122,138,104,.15);color:var(--green)}.asc-no{background:rgba(168,79,62,.12);color:var(--red)}
/* Insights */
.insight{padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:11px;display:flex;align-items:center;gap:6px}.insight-warn{background:rgba(192,112,64,.08);border:1px solid rgba(192,112,64,.18);color:var(--orange)}.insight-good{background:rgba(122,138,104,.08);border:1px solid rgba(122,138,104,.18);color:var(--green)}.insight-info{background:rgba(107,110,82,.08);border:1px solid rgba(107,110,82,.18);color:var(--indigo)}.insight-crit{background:rgba(168,79,62,.08);border:1px solid rgba(168,79,62,.18);color:var(--red)}
.insight-icon{font-size:14px;flex-shrink:0}
/* CSV Drop Zone */
.csv-drop{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(94,60,36,.02);margin-bottom:10px}.csv-drop:hover,.csv-drop.dragover{border-color:var(--gold);background:rgba(154,104,72,.06)}.csv-drop .csv-icon{font-size:28px;margin-bottom:6px;opacity:.5}.csv-drop .csv-label{font-size:11px;font-weight:600;color:var(--muted)}.csv-drop .csv-sub{font-size:9px;color:var(--muted);margin-top:4px;opacity:.6}.csv-msg{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:600}.csv-msg-ok{background:rgba(122,138,104,.12);color:var(--green);border:1px solid rgba(122,138,104,.2)}.csv-msg-err{background:rgba(168,79,62,.1);color:var(--red);border:1px solid rgba(168,79,62,.2)}
/* Sparkline (CSS only mini bar chart) */
.spark{display:flex;align-items:flex-end;gap:1px;height:24px}.spark-bar{flex:1;min-width:2px;border-radius:1px;background:var(--gold);opacity:.6;transition:all .15s}.spark-bar:hover{opacity:1}
/* Traffic light signals */
.signal{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sig{flex:1;min-width:250px;padding:14px;border-radius:8px;background:var(--card);border:1px solid var(--border)}
.sig-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sig-dot{width:12px;height:12px;border-radius:50%}
.sig-dot-green{background:#7A8A68;box-shadow:0 0 6px rgba(122,138,104,.3)}
.sig-dot-yellow{background:#C9A87A;box-shadow:0 0 6px rgba(201,168,122,.3)}
.sig-dot-red{background:#A84F3E;box-shadow:0 0 6px rgba(168,79,62,.3)}
.sig-dot-gray{background:#8A8C74}
.sig-title{font-size:12px;font-weight:700;color:var(--text)}
.sig-action{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.sig-metrics{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.sig-metric{font-size:9px;color:var(--muted);font-family:ui-monospace,'SF Mono',monospace}
.sig-metric span{color:var(--text);font-weight:700}
/* Cohort table */
.cohort-tbl{width:100%;border-collapse:collapse;font-size:10px}.cohort-tbl th{text-align:center;padding:6px 8px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase}.cohort-tbl td{padding:5px 8px;text-align:center;border-bottom:1px solid rgba(94,60,36,.06);font-family:ui-monospace,'SF Mono',monospace;font-size:10px}.cohort-tbl td:first-child{text-align:left}
/* Subscription badges */
.sub-badge{display:inline-flex;align-items:center;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700;letter-spacing:.3px;margin-left:3px}
.sub-trial{background:rgba(90,138,158,.15);color:var(--blue)}.sub-paid{background:rgba(122,138,104,.15);color:var(--green)}.sub-free{background:rgba(94,60,36,.06);color:var(--muted)}
/* Today marker */
.today-mark{display:inline-flex;align-items:center;padding:1px 5px;border-radius:3px;font-size:7px;font-weight:700;letter-spacing:.3px;background:rgba(201,168,122,.2);color:var(--yellow);margin-left:3px}
/* Tooltip for full ID */
.uid-tip{position:relative;cursor:pointer}.uid-tip:hover::after{content:attr(data-full);position:absolute;left:0;top:-20px;background:var(--text);color:var(--bg);padding:2px 6px;border-radius:3px;font-size:8px;white-space:nowrap;z-index:10;pointer-events:none}
/* Journey timeline */
.journey-phase{margin-bottom:10px;padding:8px 10px;border-left:3px solid var(--border);border-radius:0 6px 6px 0;background:rgba(94,60,36,.02)}
.journey-phase-hdr{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:var(--muted)}
.journey-phase-hdr.onboarding{color:var(--blue)}.journey-phase-hdr.subscription{color:var(--green)}.journey-phase-hdr.engagement{color:var(--gold)}.journey-phase-hdr.social{color:var(--indigo)}
.journey-evt{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:10px}.journey-evt .je-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.journey-evt .je-name{font-weight:500}.journey-evt .je-time{font-size:8px;color:var(--muted);font-family:ui-monospace,'SF Mono',monospace;margin-left:auto}
.journey-key{border-left-color:var(--gold) !important;background:rgba(154,104,72,.04) !important}
.journey-gap{text-align:center;padding:2px 0;color:var(--muted);font-size:8px;font-family:ui-monospace,'SF Mono',monospace;opacity:.5;font-style:italic}
.view-toggle{display:flex;gap:4px;margin-bottom:8px}.view-btn{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:system-ui,-apple-system,sans-serif}.view-btn:hover{border-color:var(--text);color:var(--text)}.view-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(154,104,72,.1)}
@media(max-width:900px){.kg{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.ug{grid-template-columns:1fr}.dr-dates{display:none}}
</style>
</head>

<div class="c">

  <div class="tabs"><button class="tab active" onclick="go('overview',this)">Overview</button><button class="tab" onclick="go('funnel',this)">Funnel</button><button class="tab" onclick="go('users',this)">Users</button><button class="tab" onclick="go('events',this)">Events</button><button class="tab" onclick="go('revenue',this)">Revenue</button><button class="tab" onclick="go('web',this)">Web</button><button class="tab" onclick="go('circles',this)">Circles</button><button class="tab" onclick="go('growth',this)">Growth</button><button class="tab" onclick="go('organic',this)">Organic</button><button class="tab" onclick="go('admin',this)">Admin</button></div></div></div>

<script>
var B=location.origin,K=new URLSearchParams(location.search).get("key")||"",

// Event colors & labels
var C={app_opened:"#6B6E52",prayer_logged:"#D4845A",paywall_viewed:"#A84F3E",paywall_plan_selected:"#B89E82",onboarding_completed:"#7A8A68",circle_created:"#88A8BC",circle_left:"#8A8C74",prayer_request_created:"#7A4F32",share_tapped:"#7F835F",scripture_viewed:"#9A6848",circle_invite_accepted:"#88A8BC",circle_member_joined:"#88A8BC",encouragement_sent:"#7F835F",user_signed_up:"#7A8A68",account_deleted:"#A84F3E",email_opt_in:"#7A8A68",streak_milestone:"#D4845A",subscription_started:"#7A8A68",subscription_cancelled:"#A84F3E",subscription_renewed:"#7F835F",subscription_expired:"#A84F3E",lifetime_purchased:"#9A6848",billing_issue_detected:"#D4845A"};

// ─── Date helpers ──────────────────────────────────────────────
function daysAgo(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}
function inRange(ts,from,to){var t=new Date(ts);return t>=from&&t<=to}
function fmtDate(d){return d.toISOString().split('T')[0]}
function fmtShort(d){return(d.getMonth()+1)+'/'+d.getDate()}
function getRangeFrom(){return CUSTOM_FROM||daysAgo(RANGE)}
function getRangeTo(){return CUSTOM_TO||new Date()}
function updateDateLabel(){
  var from=getRangeFrom(),to=getRangeTo();

// ─── Delta calculation ────────────────────────────────────────

// ─── Compute metrics from events ──────────────────────────────
function computeMetrics(events){
  var users=new Set(),pTaps=0,prayers=0,signups=0,pwViews=0,circles=0,scrip=0,onboard=0,enc=0;
  var pwUsers=new Set(),ptUsers=new Set();
  var ec={},topics={},plans={},dauMap={};
  var fnSets={first_open:new Set(),onboarding:new Set(),paywall:new Set(),plan_tap:new Set(),subscribed:new Set(),cancelled:new Set(),prayer:new Set(),circle:new Set(),signup:new Set(),scripture:new Set()};
  for(var i=0;i<events.length;i++){
    var e=events[i];
    if(e.event==="$identify")continue;
    users.add(e.full_user_id);
    ec[e.event]=(ec[e.event]||0)+1;
    var d=e.timestamp.split('T')[0];if(!dauMap[d])dauMap[d]=new Set();dauMap[d].add(e.full_user_id);
    if(e.event==="paywall_plan_selected"){pTaps++;ptUsers.add(e.full_user_id);if(e.properties.plan)plans[e.properties.plan]=(plans[e.properties.plan]||0)+1;fnSets.plan_tap.add(e.full_user_id)}
    if(e.event==="prayer_logged"){prayers++;if(e.properties.type)topics[e.properties.type]=(topics[e.properties.type]||0)+1;fnSets.prayer.add(e.full_user_id)}
    if(e.event==="user_signed_up"){signups++;fnSets.signup.add(e.full_user_id)}
    if(e.event==="paywall_viewed"){pwViews++;pwUsers.add(e.full_user_id);fnSets.paywall.add(e.full_user_id)}
    if(e.event==="circle_created"){circles++;fnSets.circle.add(e.full_user_id)}
    if(e.event==="scripture_viewed"){scrip++;fnSets.scripture.add(e.full_user_id)}
    if(e.event==="onboarding_completed"){onboard++;fnSets.onboarding.add(e.full_user_id)}
    if(e.event==="encouragement_sent")enc++;
    if(e.event==="subscription_started"||e.event==="lifetime_purchased")fnSets.subscribed.add(e.full_user_id);
    if(e.event==="subscription_cancelled")fnSets.cancelled.add(e.full_user_id);
    if(e.properties.is_first_open===true||e.properties.is_first_open==="True")fnSets.first_open.add(e.full_user_id);
  }
  var dau=Object.entries(dauMap).map(function(x){return{date:x[0],dau:x[1].size}}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var avgDau=dau.length?Math.round(dau.reduce(function(s,x){return s+x.dau},0)/dau.length):0;
  return{users:users.size,pTaps:pTaps,prayers:prayers,signups:signups,pwViews:pwViews,circles:circles,scripture:scrip,onboarding:onboard,encouragements:enc,eventCounts:ec,topics:topics,plans:plans,dau:dau,avgDau:avgDau,totalEvents:events.length,funnel:fnSets,pwUsers:pwUsers.size,ptUsers:ptUsers.size};
}

// ─── Render ──────────────────────────────────────────────────
function renderChurnAlerts(){
  if(!PH||!PH.recent_events)return'';

    .filter(function(e){
      // Filter out renewal events that are actually trial starts (period_type=trial, price=0)
      if(e.event==='subscription_renewed'&&e.properties&&(e.properties.period_type==='trial'||e.properties.price===0||e.properties.$revenue===0))return false;
      // Filter out $RCAnonymous ghost events — these are duplicate/re-fired webhooks
      var uid=e.full_user_id||e.distinct_id||'';
      if(uid.indexOf('$RCAnonymous')>=0)return false;
      return true;
    });
  if(!cancels.length)return'';
  // Dedupe by user, keep most recent
  var byUser={};
  cancels.forEach(function(e){
    var uid=e.full_user_id||e.distinct_id;
    if(!byUser[uid]||e.timestamp>byUser[uid].timestamp)byUser[uid]=e;
  });
  var recent=Object.values(byUser).sort(function(a,b){return b.timestamp.localeCompare(a.timestamp)}).slice(0,5);
  var html='<div style="margin-bottom:12px">';
  recent.forEach(function(e){
    var uid=e.full_user_id||e.distinct_id;
    var short=uid.substring(0,8);
    // Look up name from RC subscribers or all_users
    var name=e.properties?.$name||null;
    if(!name&&RC){
      var allUsers=(RC.subscribers||[]).concat(RC.all_users||[]);
      var match=allUsers.find(function(s){return s.user_id===uid||s.user_id?.startsWith(uid)});
      if(match&&match.name)name=match.name;
      else if(match&&match.email)name=match.email.split('@')[0];
    }
    if(!name)name=short;
    var plan=e.properties?.plan||e.properties?.product_id||'unknown';
    var isTrial=e.properties&&(e.properties.period_type==='trial'||e.properties.price===0||e.properties.$revenue===0);
    var typeMap={'subscription_cancelled':['Cancelled','⚠','var(--red)','rgba(168,79,62,.06)'],
      'subscription_started':[isTrial?'Started Trial':'Subscribed',isTrial?'✦':'★',isTrial?'var(--green)':'var(--gold)',isTrial?'rgba(74,122,62,.06)':'rgba(154,104,72,.06)'],
      'subscription_renewed':['Converted','★','var(--gold)','rgba(154,104,72,.06)'],
      'lifetime_purchased':['Lifetime','★','var(--gold)','rgba(154,104,72,.06)']};
    var info=typeMap[e.event]||['Unknown','·','var(--muted)','rgba(0,0,0,.03)'];
    var type=info[0],icon=info[1],color=info[2],bgColor=info[3];
    var ago=timeAgo(e.timestamp);
    html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:4px;background:'+bgColor+';border-left:3px solid '+color+';border-radius:4px;font-size:11px">';
    html+='<span style="font-size:13px">'+icon+'</span>';
    html+='<span style="font-weight:700;color:'+color+'">'+type+'</span>';
    html+='<span style="color:var(--text)">'+name+'</span>';
    html+='<span style="color:var(--muted)">'+plan.replace('pramen.individual.','')+'</span>';
    html+='<span style="color:var(--muted);margin-left:auto;font-size:10px">'+ago+'</span>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}
function timeAgo(ts){
  var d=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';
}

function kpi(l,v,c,delta){return'<div class="k"><div class="l">'+l+'</div><div class="v" style="color:'+c+'">'+v+'</div>'+deltaHtml(delta)+'</div>'}

// ─── Daily chart drawing ─────────────────────────────────────
function drawDailyChart(ds){
  var canvas=document.getElementById('dailyChart');
  if(!canvas)return;
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;

  // Parse data: build per-date series
  var dateMap={};
  ds.forEach(function(r){
    if(!dateMap[r.date])dateMap[r.date]={meta_installs:0,meta_trials:0,asa_installs:0};
    var ch=r.channel?r.channel.toLowerCase():'';
    if(ch==='meta'){dateMap[r.date].meta_installs+=r.installs||0;dateMap[r.date].meta_trials+=r.trials||0}
    if(ch==='asa'||ch==='apple'){dateMap[r.date].asa_installs+=r.installs||0}
  });
  var dates=Object.keys(dateMap).sort();
  if(dates.length<2)return;

  var metaI=dates.map(function(d){return dateMap[d].meta_installs});
  var metaT=dates.map(function(d){return dateMap[d].meta_trials});
  var asaI=dates.map(function(d){return dateMap[d].asa_installs});

  var allVals=metaI.concat(metaT).concat(asaI);
  var maxVal=Math.max.apply(null,allVals);
  if(maxVal===0)maxVal=1;

  // Padding
  var padL=48,padR=16,padT=16,padB=40;
  var cW=W-padL-padR,cH=H-padT-padB;

  // Background
  ctx.fillStyle='#F2EDD8';
  ctx.fillRect(0,0,W,H);

  // Grid lines + Y labels
  ctx.strokeStyle='rgba(94,60,36,0.1)';
  ctx.lineWidth=1;
  ctx.fillStyle='#545742';
  ctx.font='9px ui-monospace, SF Mono, monospace';
  ctx.textAlign='right';
  var ySteps=5;
  for(var i=0;i<=ySteps;i++){
    var y=padT+cH-cH*(i/ySteps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    var label=Math.round(maxVal*i/ySteps);
    ctx.fillText(label,padL-6,y+3);
  }

  // X axis labels
  ctx.textAlign='center';
  ctx.fillStyle='#5E3C24';
  var labelEvery=Math.max(1,Math.floor(dates.length/8));
  for(var i=0;i<dates.length;i++){
    if(i%labelEvery===0||i===dates.length-1){
      var x=padL+cW*(i/(dates.length-1));
      var parts=dates[i].split('-');
      var lbl=parseInt(parts[1])+'/'+parseInt(parts[2]);
      ctx.fillText(lbl,x,H-padB+16);
    }
  }

  // Draw lines
  function drawLine(vals,color){
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.beginPath();
    for(var i=0;i<vals.length;i++){
      var x=padL+cW*(i/(vals.length-1));
      var y=padT+cH-cH*(vals[i]/maxVal);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Draw dots
    for(var i=0;i<vals.length;i++){
      var x=padL+cW*(i/(vals.length-1));
      var y=padT+cH-cH*(vals[i]/maxVal);
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();
    }
  }

  var styles=getComputedStyle(document.documentElement);
  var blue=styles.getPropertyValue('--blue').trim()||'#5A8A9E';
  var green=styles.getPropertyValue('--green').trim()||'#7A8A68';
  var orange=styles.getPropertyValue('--orange').trim()||'#C07040';

  drawLine(metaI,blue);
  drawLine(metaT,green);
  drawLine(asaI,orange);
}

// ─── Insights generator ──────────────────────────────────────
function generateInsights(m,pm){
  var ins=[];
  if(m.pwUsers>0&&m.ptUsers>0){
    var conv=pct(m.ptUsers,m.pwUsers);
    if(conv<5)ins.push({type:'crit',icon:'!!',text:'Paywall conversion at '+conv+'% ('+m.ptUsers+' unique tappers / '+m.pwUsers+' viewers). Fix pricing display and CTA.'});
    else if(conv<15)ins.push({type:'warn',icon:'--',text:'Paywall conversion at '+conv+'%. Room to improve. Test leading with Prayer Circles.'});
  }
  if(m.pTaps>10){
    var rc=RC?.summary||{};
    var purchases=rc.active_subscriptions||0;
    if(purchases===0)ins.push({type:'crit',icon:'!!',text:m.pTaps+' plan taps but 0 purchases tracked. Paywall is broken or RC IDs not linked.'});
  }
  if(m.circles===0&&m.users>5)ins.push({type:'warn',icon:'--',text:'No new circles created in this period. Push Circle feature in content and onboarding.'});
  if(m.encouragements>10)ins.push({type:'good',icon:'OK',text:m.encouragements+' encouragements sent. Circle engagement is healthy.'});
  if(COMPARE&&pm){
    if(pm.users>0){var userGrowth=pct(m.users-pm.users,pm.users);if(userGrowth>20)ins.push({type:'good',icon:'UP',text:'User base grew '+userGrowth+'% vs previous period.'});if(userGrowth<-10)ins.push({type:'warn',icon:'DN',text:'User base declined '+Math.abs(userGrowth)+'% vs previous period.'});}
    if(pm.prayers>0){var prayerGrowth=pct(m.prayers-pm.prayers,pm.prayers);if(prayerGrowth>20)ins.push({type:'good',icon:'UP',text:'Prayers logged up '+prayerGrowth+'%. Engagement increasing.'});}
  }
  if(m.avgDau>0&&m.avgDau<3)ins.push({type:'warn',icon:'--',text:'Avg DAU is '+m.avgDau+'. Focus on push notifications and streak reminders.'});
  return ins;
}

  html+='<h3 style="margin-top:14px">Plan Interest</h3>';

  // Use RevenueCat for subscription status (source of truth), fall back to DB
  html+='</div><div class="cd"><h3>Subscription Status (RevenueCat)</h3>';

  html+=row("MRR (Gross)","$"+(rc.mrr_estimated||0).toFixed(2),"var(--gold)");
  html+=row("MRR (Net)","$"+(rc.net_mrr||0).toFixed(2),"var(--gold)");

  // Plan breakdown from subscriber data
  var subs=RC&&RC.subscribers?RC.subscribers:[];
  var planMonthly=0,planYearly=0,planLifetime=0;
  subs.forEach(function(s){
    var activeSubs=(s.subscriptions||[]).filter(function(x){return x.is_active});
    activeSubs.forEach(function(x){
      if(x.product.indexOf('lifetime')>=0)planLifetime++;
      else if(x.product.indexOf('yearly')>=0)planYearly++;
      else if(x.product.indexOf('monthly')>=0)planMonthly++;
    });
  });
  if(planMonthly+planYearly+planLifetime>0){
    html+='<h3 style="margin-top:14px">Active Plans</h3>';
    html+='<div class="kg" style="grid-template-columns:repeat(3,1fr)">';
    html+=kpi("Monthly",planMonthly,"var(--blue)");
    html+=kpi("Yearly",planYearly,"var(--green)");
    html+=kpi("Lifetime",planLifetime,"var(--gold)");

  }
  html+='<h3 style="margin-top:14px">Circles</h3>'+row("Active",D.circles.total,"var(--blue)")+row("Members",D.circles.total_members,"var(--indigo)")+row("Encouragements",D.circles.total_encouragements||0,"var(--teal)");

  html+=renderCancellationFunnel();

  // ─── User Journey Summary Table ──────────────────────────────
  html+=renderJourneyTable(p.cur);

  return html;
}

function renderAdSummary(){
  if(!GR||!GR.meta_hierarchy||!GR.meta_hierarchy.length)return'';
  var ads=[];
  GR.meta_hierarchy.forEach(function(c){(c.adsets||[]).forEach(function(as){(as.ads||[]).forEach(function(ad){
    if(ad.spend>0)ads.push(ad);
  })})});
  ads.sort(function(a,b){return(b.installs||0)-(a.installs||0)});
  var activeAds=ads.filter(function(a){return a.spend>1});
  if(!activeAds.length)return'';
  var totalSpend=activeAds.reduce(function(s,a){return s+a.spend},0);
  var totalInstalls=activeAds.reduce(function(s,a){return s+(a.installs||0)},0);
  var html='<div class="cd" style="margin-top:16px"><h3>Ad Creative Performance</h3>';
  html+='<div class="kg" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">'+kpi("Total Spend","$"+totalSpend.toFixed(0),"var(--red)")+kpi("Total Installs",totalInstalls,"var(--green)")+kpi("Blended CPI",totalInstalls>0?"$"+(totalSpend/totalInstalls).toFixed(2):"—","var(--blue)")+'</div>';
  html+='<table class="tbl"><tr><th>Ad</th><th>Spend</th><th>Installs</th><th>CPI</th><th>Status</th></tr>';
  activeAds.forEach(function(ad){
    var cpi=ad.installs>0?(ad.spend/ad.installs).toFixed(2):'—';
    var statusColor=ad.installs>=5?'var(--green)':ad.installs>0?'var(--orange)':'var(--muted)';
    var statusLabel=ad.installs>=5?'Winner':ad.installs>0?'Learning':'No data';
    html+='<tr><td><strong style="color:var(--text)">'+ad.name+'</strong></td>';
    html+='<td class="mono">$'+ad.spend.toFixed(0)+'</td>';
    html+='<td class="mono" style="color:var(--green)">'+(ad.installs||0)+'</td>';
    html+='<td class="mono" style="color:var(--blue)">'+(cpi!=='—'?'$'+cpi:cpi)+'</td>';
    html+='<td style="color:'+statusColor+';font-size:11px;font-weight:600">'+statusLabel+'</td></tr>';
  });
  html+='</table></div>';
  return html;
}

function renderCancellationFunnel(){

    }).join('<span style="color:var(--muted);font-size:10px"> → </span>');

// ─── Journey Table Builder ─────────────────────────────────────
function renderJourneyTable(events){
  if(!events||!events.length)return'';

  // Group events by user
  var userMap={};
  events.forEach(function(e){
    if(e.event==='$identify')return;
    var uid=e.full_user_id;
    if(!userMap[uid])userMap[uid]={uid:uid,name:e.user||'',events:[]};
    if(e.user&&!userMap[uid].name)userMap[uid].name=e.user;
    userMap[uid].events.push(e);
  });

  var users=Object.values(userMap);
  if(!users.length)return'';

  // Build rows
  var rows=[];
  users.forEach(function(u){
    // Filter out server-side events that aren't real user actions
    var serverEvents=['inactive_trial_nudge_sent','paywall_nudge_sent','streak_at_risk_push','last_one_standing_nudge','circle_all_prayed'];
    var evts=u.events.filter(function(e){return serverEvents.indexOf(e.event)<0}).sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp)});

    // Skip users whose only events were server-side nudges
    if(evts.length===0)return;

    // First app_opened
    var firstOpen=null;
    var hasAppOpen=false;
    evts.forEach(function(e){if(e.event==='app_opened'&&!firstOpen){firstOpen=e.timestamp;hasAppOpen=true}});
    if(!firstOpen&&evts.length)firstOpen=evts[0].timestamp;

    var openTime=firstOpen?new Date(firstOpen):null;
    var openStr=openTime?(('0'+openTime.getHours()).slice(-2)+':'+('0'+openTime.getMinutes()).slice(-2)):'--';

    // Onboarding
    var obCompleted=false,obSteps=0;
    evts.forEach(function(e){
      if(e.event==='onboarding_completed')obCompleted=true;
      if(e.event==='onboarding_step_completed')obSteps++;
    });
    var obStr=obCompleted?'Yes':(obSteps>0?'Partial ('+obSteps+' steps)':'No');

    // Paywall views
    var pwCount=0;
    evts.forEach(function(e){if(e.event==='paywall_viewed')pwCount++});
    var pwStr=pwCount>0?pwCount+'x':'No';

    // Plan taps
    var planTaps=0;
    evts.forEach(function(e){if(e.event==='paywall_plan_selected')planTaps++});

    // Subscription — check all subscription events (started, renewed, lifetime)
    var subEvt=null;
    var renewEvt=null;
    evts.forEach(function(e){
      if(e.event==='subscription_started'||e.event==='lifetime_purchased')subEvt=e;
      if(e.event==='subscription_renewed')renewEvt=e;
    });
    // A renewal without a start means trial-to-paid conversion
    if(!subEvt&&renewEvt)subEvt=renewEvt;
    var subStr='No';
    if(subEvt){
      var plan=(subEvt.properties&&subEvt.properties.plan)||'';
      var price=subEvt.properties&&subEvt.properties.price?parseFloat(subEvt.properties.price):0;
      if(subEvt.event==='lifetime_purchased')subStr='Yes, lifetime';
      else if(subEvt.event==='subscription_renewed')subStr='Yes, '+(plan||'converted');
      else if(price===0||plan.indexOf('trial')>=0||(subEvt.properties&&subEvt.properties.period_type==='trial'))subStr='Yes, trial';
      else if(plan.indexOf('yearly')>=0||plan.indexOf('annual')>=0)subStr='Yes, yearly';
      else if(plan.indexOf('monthly')>=0)subStr='Yes, monthly';
      else subStr='Yes'+(plan?', '+plan:'');
    }

    // Status
    var status='',statusCls='';
    if(subEvt){status='Converted';statusCls='color:var(--green);font-weight:700'}
    else if(pwCount>=5&&!subEvt){status='Stuck on paywall';statusCls='color:var(--orange);font-weight:700'}
    else if(pwCount>0&&planTaps===0&&!subEvt){status='Bounced at paywall';statusCls='color:var(--red);font-weight:700'}
    else if((obSteps>0&&!obCompleted)&&pwCount===0){status='Dropped in onboarding';statusCls='color:var(--muted)'}
    else if(pwCount>0&&!subEvt){status='Active free';statusCls='color:var(--blue)'}
    else{
      // Check if user did anything beyond app_opened
      var nonOpenEvents=evts.filter(function(e){return e.event!=='app_opened'&&e.event!=='$identify'});
      if(nonOpenEvents.length===0){status='Opened only';statusCls='color:var(--muted);opacity:.6'}
      else{status='Active free';statusCls='color:var(--blue)'}
    }

    // Display name
    var displayName=u.name||(u.uid.length>10?u.uid.substring(0,10)+'...':u.uid);

    rows.push({
      uid:u.uid,name:displayName,openTime:openTime,openStr:openStr,
      obStr:obStr,pwStr:pwStr,pwCount:pwCount,planTaps:planTaps,
      subStr:subStr,status:status,statusCls:statusCls,
      hasSubscription:!!subEvt
    });
  });

  // Sort by most recent first
  rows.sort(function(a,b){return(b.openTime||0)-(a.openTime||0)});

  var rangeLabel=CUSTOM_FROM?'Selected Range':'Today';
  var html='<div class="cd" style="margin-top:12px"><h3>User Journey Summary ('+rangeLabel+') <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;font-size:8px"> · '+rows.length+' users</span></h3>';
  html+='<div style="overflow-x:auto"><table class="tbl"><tr><th>User</th><th>Opened</th><th>Completed Onboarding</th><th>Saw Paywall</th><th>Plan Taps</th><th>Subscribed</th><th>Status</th></tr>';
  rows.forEach(function(r){
    html+='<tr>';
    html+='<td class="mono" style="color:var(--gold);cursor:pointer" onclick="filterUser(\''+r.uid+'\')">'+r.name+'</td>';
    html+='<td class="mono">'+r.openStr+'</td>';
    html+='<td style="color:'+(r.obStr==='Yes'?'var(--green)':r.obStr==='No'?'var(--muted)':'var(--orange)')+'">'+r.obStr+'</td>';
    html+='<td class="mono" style="color:'+(r.pwCount>0?'var(--red)':'var(--muted)')+'">'+r.pwStr+'</td>';
    html+='<td class="mono" style="color:'+(r.planTaps>0?'var(--pink)':'var(--muted)')+'">'+r.planTaps+'</td>';
    html+='<td style="color:'+(r.hasSubscription?'var(--green)':'var(--muted)')+'">'+r.subStr+'</td>';
    html+='<td style="'+r.statusCls+'">'+r.status+'</td>';
    html+='</tr>';
  });
  html+='</table></div></div>';
  return html;
}

function rFn(){
  if(!PH)return'<div class="err">PostHog not connected</div>';
  var p=getPeriodEvents(),m=computeMetrics(p.cur),pm=COMPARE?computeMetrics(p.prev):null;
  var fn=m.funnel;
  var steps=[
    {l:"First Open",c:fn.first_open.size,cl:"var(--green)",k:"first_open"},
    {l:"Onboarding",c:fn.onboarding.size,cl:"var(--blue)",k:"onboarding"},
    {l:"Paywall View",c:fn.paywall.size,cl:"var(--red)",k:"paywall"},
    {l:"Plan Tapped",c:fn.plan_tap.size,cl:"var(--pink)",k:"plan_tap"},
    {l:"Signed Up",c:fn.signup.size,cl:"var(--indigo)",k:"signup"},
    {l:"Subscribed",c:fn.subscribed.size,cl:"var(--gold)",k:"subscribed"},
    {l:"First Prayer",c:fn.prayer.size,cl:"var(--orange)",k:"prayer"},
    {l:"Scripture",c:fn.scripture.size,cl:"var(--purple)",k:"scripture"},
    {l:"Circle Created",c:fn.circle.size,cl:"var(--teal)",k:"circle"}
  ];
  var mx=steps[0].c||1;

  var html='';
  if(fn.cancelled.size>0)html+='<div class="insight insight-crit"><span class="insight-icon" style="font-weight:700;font-size:10px;font-family:ui-monospace,monospace">!!</span>'+fn.cancelled.size+' user'+(fn.cancelled.size>1?'s':'')+' cancelled subscription in this period</div>';

  html+='<div class="cd"><h3>Activation Funnel ('+RANGE+'d)'+
    (COMPARE?' <span style="color:var(--blue);font-size:8px">vs previous '+RANGE+'d</span>':'')+'</h3>';
  html+=steps.map(function(s,i){
    var p2=s.c/mx*100;
    var dr=i>0&&steps[i-1].c>0?Math.round((steps[i-1].c-s.c)/steps[i-1].c*100):null;
    var stepRate=i>0&&steps[i-1].c>0?Math.round(s.c/steps[i-1].c*100):null;
    var prevVal=COMPARE&&pm?pm.funnel[s.k].size:null;
    var delt=prevVal!==null?calcDelta(s.c,prevVal):null;
    var stepHtml='';
    if(i>0&&stepRate!==null)stepHtml+='<div class="f-step-rate">'+stepRate+'% step conversion'+(dr>0?' (-'+dr+'% drop)':'')+'</div>';
    stepHtml+='<div class="fs"><div class="fh"><div><span class="fn">'+(i+1)+'</span><span class="fl">'+s.l+'</span></div><div>'+(delt!==null?'<span style="font-size:8px;color:'+(delt>=0?'var(--green)':'var(--red)')+';margin-right:4px">'+(delt>=0?'+':'')+ delt+'%</span>':'')+(dr>0?'<span class="fd">-'+dr+'%</span>':'')+'<span class="fc">'+s.c+'</span></div></div><div class="fba"><div class="ff" style="width:'+p2+'%;min-width:'+(s.c>0?12:0)+'px;background:'+s.cl+'"></div><span class="fp" style="color:'+(p2>35?'var(--bg)':'var(--muted)')+'">'+Math.round(p2)+'%</span></div></div>';
    return stepHtml;
  }).join('');
  html+='</div>';

  html+='<div class="g2"><div class="cd"><h3>Key Conversion Rates</h3>';
  var rates=[
    {l:"Open > Onboarding",v:pct(fn.onboarding.size,fn.first_open.size)},
    {l:"Onboarding > Paywall",v:pct(fn.paywall.size,fn.onboarding.size)},
    {l:"Paywall > Plan Tap",v:pct(fn.plan_tap.size,fn.paywall.size)},
    {l:"Plan Tap > Signup",v:pct(fn.signup.size,fn.plan_tap.size)},
    {l:"Signup > Subscribed",v:pct(fn.subscribed.size,fn.signup.size)},
    {l:"Signup > Prayer",v:pct(fn.prayer.size,fn.signup.size)},
    {l:"Signup > Circle",v:pct(fn.circle.size,fn.signup.size)},
    {l:"Open > Subscribed (overall)",v:pct(fn.subscribed.size,fn.first_open.size)},
    {l:"Open > Signup (overall)",v:pct(fn.signup.size,fn.first_open.size)},
    {l:"Open > Circle (overall)",v:pct(fn.circle.size,fn.first_open.size)},
  ];
  html+=rates.map(function(r){var c=r.v>=50?"var(--green)":r.v>=20?"var(--orange)":"var(--red)";return row(r.l,r.v+'%',c)}).join('');
  html+='</div>';

  html+='<div class="cd"><h3>DAU Trend</h3>'+(m.dau.length?m.dau.slice(0,RANGE).map(function(d){return row(d.date,d.dau,"var(--indigo)")}).join(''):'—');
  html+='</div></div>';

  if(PH.users){
    var intent=PH.users.filter(function(u){return u.plan_taps>0}).sort(function(a,b){return b.plan_taps-a.plan_taps});
    if(intent.length){html+='<div class="cd"><h3>Highest Intent Users ('+intent.length+' with plan taps)</h3>'+intent.slice(0,15).map(function(u){return'<div class="tr"><span class="n"><span class="mono" style="color:var(--gold);cursor:pointer" onclick="filterUser(\''+u.full_id+'\')">'+u.id+'</span>'+(u.city?' <span style="font-size:8px;color:var(--muted)">'+u.city+'</span>':'')+'</span><span class="ct" style="color:var(--pink)">'+u.plan_taps+' taps</span></div>'}).join('')+'</div>';}
  }
  return html;
}

function timeAgo(ts){var d=Date.now()-new Date(ts).getTime(),s=Math.floor(d/1000),m2=Math.floor(s/60),h=Math.floor(m2/60),dy=Math.floor(h/24);if(dy>0)return dy+"d ago";if(h>0)return h+"h ago";if(m2>0)return m2+"m ago";return "just now"}
function engScore(u){var s=0;s+=Math.min(u.event_count*2,40);s+=(u.event_types.prayer_logged||0)*3;s+=(u.event_types.circle_created||0)*5;s+=(u.event_types.encouragement_sent||0)*2;s+=(u.event_types.scripture_viewed||0)*1;s+=u.max_streak*2;s+=u.plan_taps*4;return Math.min(s,100)}
function userSeg(u){var sc=engScore(u);var daysSinceLast=Math.floor((Date.now()-new Date(u.last_seen).getTime())/(24*60*60*1000));if(sc>=60&&daysSinceLast<3)return{l:"POWER",c:"seg-power",clr:"var(--green)"};if(daysSinceLast>5)return{l:"DORMANT",c:"seg-dormant",clr:"var(--red)"};if(daysSinceLast>2&&sc<30)return{l:"AT RISK",c:"seg-atrisk",clr:"var(--orange)"};var firstDay=Math.floor((Date.now()-new Date(u.first_seen).getTime())/(24*60*60*1000));if(firstDay<2)return{l:"NEW",c:"seg-new",clr:"var(--blue)"};return{l:"ACTIVE",c:"seg-active",clr:"var(--indigo)"}}
function gapLabel(ms){var h=Math.floor(ms/(60*60*1000));if(h>=24)return Math.floor(h/24)+"d gap";if(h>0)return h+"h gap";var m2=Math.floor(ms/(60*1000));return m2+"m gap"}

function usrSubStatus(u,events){
  var uEvents=events.filter(function(e){return e.full_user_id===u.full_id});
  var subEvt=uEvents.find(function(e){return e.event==='subscription_started'||e.event==='lifetime_purchased'});
  if(!subEvt)return{label:'FREE',cls:'sub-free'};
  var price=subEvt.properties&&subEvt.properties.price?parseFloat(subEvt.properties.price):0;
  if(price===0)return{label:'TRIAL',cls:'sub-trial'};
  return{label:'PAID',cls:'sub-paid'};
}
function isToday(ts){var d=new Date(ts),now=new Date();return d.toDateString()===now.toDateString()}
function journeyPhase(evtName){
  if(['user_signed_up','onboarding_completed','app_opened','email_opt_in'].indexOf(evtName)>=0)return'onboarding';
  if(['subscription_started','subscription_cancelled','subscription_renewed','subscription_expired','lifetime_purchased','paywall_viewed','paywall_plan_selected','billing_issue_detected'].indexOf(evtName)>=0)return'subscription';
  if(['circle_created','circle_left','circle_invite_accepted','circle_member_joined','encouragement_sent','prayer_request_created','share_tapped'].indexOf(evtName)>=0)return'social';
  return'engagement';
}
function isKeyMoment(evtName){return['user_signed_up','subscription_started','prayer_logged','circle_created','onboarding_completed','lifetime_purchased'].indexOf(evtName)>=0}

  // Sort users: today's new users first, then by last_seen
  var sortedUsers=users.slice().sort(function(a,b){

    return new Date(b.last_seen)-new Date(a.last_seen);
  });

  // Filter by search

  })}

  return'<div class="kg" style="grid-template-columns:repeat(5,1fr)">'+kpi("Power Users",segs.POWER,"var(--green)")+kpi("Active",segs.ACTIVE,"var(--indigo)")+kpi("New",segs.NEW,"var(--blue)")+kpi("At Risk",segs["AT RISK"],"var(--orange)")+kpi("Dormant",segs.DORMANT,"var(--red)")+'</div>'+
  '<div class="ug"><div class="cd" style="max-height:580px;overflow-y:auto"><h3>Users ('+displayUsers.length+(displayUsers.length!==users.length?' of '+users.length:'')+') · Avg '+avgEv+' events</h3>'+
  '<div class="search-bar"><input class="search-input" type="text" placeholder="Search by ID, city, or status..." value="'+USR_SEARCH+'" oninput="setUsrSearch(this.value)"></div>'+
  displayUsers.map(function(u){var sg=userSeg(u);var sc=engScore(u);var sub=usrSubStatus(u,allEvents);var newToday=isToday(u.first_seen);var displayName=u.name||u.id;var h={pr:u.event_types.prayer_logged||0,ci:u.event_types.circle_created||0,pw:u.plan_taps,sc2:u.event_types.scripture_viewed||0,en:u.event_types.encouragement_sent||0};return'<div class="ui'+(SU===u.full_id?' ac':'')+'" onclick="SU=SU===\''+u.full_id+'\'?null:\''+u.full_id+'\';render()"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="ud" style="background:'+sg.clr+'"></span><span class="uid uid-tip" style="color:var(--gold)" data-full="'+u.full_id+'">'+displayName+'</span> <span class="seg '+sg.c+'">'+sg.l+'</span><span class="sub-badge '+sub.cls+'">'+sub.label+'</span>'+(newToday?'<span class="today-mark">TODAY</span>':'')+'</div><span style="font-size:8px;color:var(--muted)">'+timeAgo(u.last_seen)+'</span></div><div class="um"><span>'+u.event_count+'ev</span>'+(h.pr?'<span>pr:'+h.pr+'</span>':'')+(h.ci?'<span>ci:'+h.ci+'</span>':'')+(u.max_streak?'<span>str:'+u.max_streak+'</span>':'')+(h.pw?'<span>pay:'+h.pw+'</span>':'')+(h.en?'<span>enc:'+h.en+'</span>':'')+(h.sc2?'<span>scr:'+h.sc2+'</span>':'')+(u.city?'<span>'+u.city+'</span>':'')+'</div><div class="ub"><div class="ubf" style="width:'+sc+'%;background:'+sg.clr+'"></div></div></div>'}).join('')+'</div>'+
  '<div class="cd"><h3>'+(SU?'':'Recent Events')+'</h3>'+
  (selUser?'<div class="usr-hdr"><span class="usr-name uid-tip" data-full="'+selUser.full_id+'">'+(selUser.name||selUser.id)+'</span><span class="seg '+selSeg.c+'">'+selSeg.l+'</span><span class="sub-badge '+usrSubStatus(selUser,allEvents).cls+'">'+usrSubStatus(selUser,allEvents).label+'</span><span class="usr-meta">'+selUser.city+(selUser.country?' '+selUser.country:'')+'</span><button class="rbtn" onclick="SU=null;render()">X</button></div><div class="usr-stats"><div class="usr-stat"><div class="sv" style="color:var(--gold)">'+selScore+'</div><div class="sl">Score</div></div><div class="usr-stat"><div class="sv" style="color:var(--indigo)">'+selUser.event_count+'</div><div class="sl">Events</div></div><div class="usr-stat"><div class="sv" style="color:var(--green)">'+selDays+'d</div><div class="sl">Span</div></div><div class="usr-stat"><div class="sv" style="color:var(--orange)">'+selUser.max_streak+'</div><div class="sl">Streak</div></div><div class="usr-stat"><div class="sv" style="color:var(--pink)">'+selUser.plan_taps+'</div><div class="sl">Plan Taps</div></div><div class="usr-stat"><div class="sv" style="color:var(--teal)">'+(selUser.event_types.prayer_logged||0)+'</div><div class="sl">Prayers</div></div></div>'+
  '<div class="view-toggle"><button class="view-btn'+(USR_VIEW==='list'?' on':'')+'" onclick="setUsrView(\'list\')">Events</button><button class="view-btn'+(USR_VIEW==='journey'?' on':'')+'" onclick="setUsrView(\'journey\')">Journey</button></div>':'')+
  (selUser&&USR_VIEW==='journey'?renderJourney(filtered):
  '<div class="el">'+filtered.map(function(e,i){var t=new Date(e.timestamp);var gap="";if(SU&&i>0){var prev=new Date(filtered[i-1].timestamp).getTime();var diff=prev-t.getTime();if(diff>30*60*1000)gap='<div class="tgap">-- '+gapLabel(diff)+' --</div>'}return gap+'<div class="ei"><div class="ed" style="background:'+(C[e.event]||'var(--muted)')+'"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="en" style="color:'+(C[e.event]||'var(--text)')+'">'+(L[e.event]||e.event)+'</span><span class="et">'+t.toLocaleDateString()+' '+t.toLocaleTimeString()+'</span></div><div class="tg">'+((!SU)?'<span class="uid uid-tip" style="color:var(--muted);cursor:pointer" data-full="'+e.full_user_id+'" onclick="filterUser(\''+e.full_user_id+'\')">'+e.user+'</span>':'')+(e.properties.type?'<span style="color:var(--muted)">'+e.properties.type+'</span>':'')+(e.properties.plan?'<span style="color:var(--pink)">'+e.properties.plan+'</span>':'')+(e.properties.streak?'<span style="color:var(--green)">str:'+e.properties.streak+'</span>':'')+(e.properties.city?'<span style="color:var(--muted)">'+e.properties.city+'</span>':'')+'</div></div></div>'}).join('')+'</div>')+'</div></div>'}

function renderJourney(events){
  if(!events.length)return'<div style="padding:10px;color:var(--muted);font-size:10px">No events.</div>';
  var phases={onboarding:[],subscription:[],engagement:[],social:[]};
  var sorted=events.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp)});
  sorted.forEach(function(e){var ph=journeyPhase(e.event);phases[ph].push(e)});
  var phaseLabels={onboarding:'Onboarding',subscription:'Subscription',engagement:'Engagement',social:'Social'};
  var html='';
  ['onboarding','subscription','engagement','social'].forEach(function(ph){
    var evts=phases[ph];if(!evts.length)return;
    html+='<div class="journey-phase"><div class="journey-phase-hdr '+ph+'">'+phaseLabels[ph]+' ('+evts.length+')</div>';
    evts.forEach(function(e,i){
      var t=new Date(e.timestamp);var key=isKeyMoment(e.event);
      var gap='';if(i>0){var prev=new Date(evts[i-1].timestamp).getTime();var diff=t.getTime()-prev;if(diff>30*60*1000)gap='<div class="journey-gap">'+gapLabel(diff)+'</div>'}
      html+=gap+'<div class="journey-evt'+(key?' journey-key':'')+'"><div class="je-dot" style="background:'+(C[e.event]||'var(--muted)')+'"></div><span class="je-name" style="color:'+(C[e.event]||'var(--text)')+'">'+(L[e.event]||e.event)+'</span>'+(e.properties.plan?'<span style="font-size:8px;color:var(--pink);margin-left:4px">'+e.properties.plan+'</span>':'')+(e.properties.type?'<span style="font-size:8px;color:var(--muted);margin-left:4px">'+e.properties.type+'</span>':'')+'<span class="je-time">'+t.toLocaleDateString()+' '+t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div>';
    });
    html+='</div>';
  });
  return html;
}

  html+='<div class="cd"><h3>Event Types ('+RANGE+'d)</h3><table class="tbl"><tr><th>Event</th><th>Count</th><th>% of Total</th><th>Unique Users</th></tr>';

}

function rCr(){var cl=D.circles.circles||[];return'<div class="kg">'+kpi("Circles",D.circles.total,"var(--blue)")+kpi("Members",D.circles.total_members,"var(--indigo)")+kpi("Encouragements",D.circles.total_encouragements||0,"var(--teal)")+kpi("Requests",D.circles.total_prayer_requests,"var(--purple)")+'</div><div class="cd"><h3>All Prayer Circles</h3>'+(cl.length?'<table class="tbl"><tr><th>Name</th><th>Admin</th><th>Code</th><th>Members</th><th>Enc.</th><th>Req.</th><th>Created</th></tr>'+cl.map(function(c2){return'<tr><td><strong style="color:var(--text)">'+c2.name+'</strong></td><td style="color:var(--muted)">'+(c2.adminName||'—')+'</td><td class="mono" style="color:var(--gold)">'+c2.code+'</td><td class="mono">'+c2.members+'</td><td class="mono">'+(c2.encouragements||0)+'</td><td class="mono">'+c2.prayerRequests+'</td><td class="mono" style="color:var(--muted)">'+new Date(c2.createdAt).toLocaleDateString()+'</td></tr>'}).join('')+'</table>':'<div class="note">No circles.</div>')+'</div>'}

// ═══════════════════════════════════════════════════════════════
// ─── GROWTH TAB ────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function rGr(){
  if(!GR||GR.error)return'<div class="note">Growth data loading... Campaigns not yet active.</div>';
  var s=GR.signals||{};
  var a=GR.acquisition||{};
  var u=GR.unit_economics||{};
  var v=GR.viral||{};
  var cr=GR.cohort_retention||[];
  var sd=GR.streak_distribution||[];

  var html='';

  html+='<div class="signal">';
  var sigs=[
    {title:'Unit Economics',data:s.unit_economics||{},metrics:['CPA: $'+(u.cpa!==null?u.cpa.toFixed(2):'—'),'LTV: $'+(u.ltv!==null?u.ltv.toFixed(2):'—'),'ROAS: '+(u.roas!==null?u.roas.toFixed(2)+'x':'—')]},
    {title:'Viral Loop',data:s.viral_loop||{},metrics:['K: '+(v.viral_k||0),'Invites: '+v.invite_tokens_created,'Accept: '+Math.round((v.acceptance_rate||0)*100)+'%']},
    {title:'Retention',data:s.retention||{},metrics:['D7 Avg: '+(s.retention?.d7_avg_pct||0)+'%','Cohorts: '+cr.length]}
  ];
  sigs.forEach(function(sg){
    var st=sg.data.status||'gray';
    html+='<div class="sig"><div class="sig-hdr"><div class="sig-dot sig-dot-'+st+'"></div><span class="sig-title">'+sg.title+'</span></div>';
    html+='<div class="sig-action">'+(sg.data.action||'Not enough data yet.')+'</div>';
    html+='<div class="sig-metrics">'+sg.metrics.map(function(m){return'<div class="sig-metric">'+m+'</div>'}).join('')+'</div></div>';
  });
  html+='</div>';

  html+='<div class="cd"><h3>Acquisition (30d)</h3>';
  html+='<div class="kg" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">'+
    kpi("Total Ad Spend","$"+(a.total_ad_spend_30d||0).toFixed(0),"var(--red)")+
    kpi("Paid Installs",a.total_installs_30d||0,"var(--green)")+
    kpi("Blended CPI",a.blended_cpi!==null&&a.blended_cpi!==undefined?"$"+a.blended_cpi.toFixed(2):"—","var(--blue)")+
    kpi("Organic Units",a.organic?.units||0,"var(--teal)")+
    kpi("Store Impressions",a.organic?.impressions||0,"var(--indigo)")+
  '</div>';
  if(a.by_channel&&a.by_channel.length){
    html+='<table class="tbl"><tr><th>Channel</th><th>Spend</th><th>Installs</th><th>CPI</th></tr>';
    a.by_channel.forEach(function(ch){
      html+='<tr><td style="text-transform:uppercase;font-weight:600">'+ch.channel+'</td><td class="mono">$'+ch.spend.toFixed(0)+'</td><td class="mono" style="color:var(--green)">'+ch.installs+'</td><td class="mono" style="color:var(--blue)">'+(ch.cpi!==null?'$'+ch.cpi.toFixed(2):'—')+'</td></tr>';
    });
    html+='</table>';
  }
  html+='</div>';

  // Daily performance chart
  var ds=GR.daily_series||[];
  if(ds.length){
    html+='<div class="cd"><h3>Daily Performance (30d)</h3>';
    html+='<canvas id="dailyChart" width="800" height="280" style="width:100%;height:280px;border-radius:6px"></canvas>';
    html+='<div style="display:flex;gap:16px;margin-top:8px;justify-content:center">';
    html+='<span style="font-size:10px;font-weight:600;color:var(--blue)">&#9644; Meta Installs</span>';
    html+='<span style="font-size:10px;font-weight:600;color:var(--green)">&#9644; Meta Trials</span>';
    html+='<span style="font-size:10px;font-weight:600;color:var(--orange)">&#9644; ASA Installs</span>';
    html+='</div></div>';
    setTimeout(function(){drawDailyChart(ds)},0);
  }

  // Meta Ads + Apple Search Ads breakdown
  var metaCh=(a.by_channel||[]).find(function(c){return c.channel==='meta'});
  var asaCh=(a.by_channel||[]).find(function(c){return c.channel==='asa'||c.channel==='apple'});
  html+='<div class="g2">';
  html+='<div class="cd"><h3>Meta Ads</h3>';
  if(metaCh){
    html+=row("Spend","$"+metaCh.spend.toFixed(2),"var(--red)");
    html+=row("Impressions",(metaCh.impressions||0).toLocaleString(),"var(--indigo)");
    html+=row("Clicks",metaCh.clicks||0,"var(--blue)");
    html+=row("CTR",metaCh.impressions>0?((metaCh.clicks/metaCh.impressions)*100).toFixed(2)+"%":"—","var(--teal)");
    html+=row("CPM",metaCh.impressions>0?"$"+(metaCh.spend/metaCh.impressions*1000).toFixed(2):"—","var(--orange)");
    html+=row("Installs",metaCh.installs||0,"var(--green)");
    html+=row("Trials",metaCh.trials||0,"var(--gold)");
    html+=row("CPI",metaCh.installs>0?"$"+(metaCh.spend/metaCh.installs).toFixed(2):"—","var(--blue)");
  } else {
    html+='<div style="font-size:10px;color:var(--muted);padding:8px 0">No Meta spend data yet.<br><br>';
    html+='<strong style="color:var(--text)">Planned:</strong> AEO Broad $47/day + AEO Proxy $20/day = $67/day</div>';
  }
  html+='</div>';
  html+='<div class="cd"><h3>Apple Search Ads</h3>';
  if(asaCh){
    html+=row("Spend","$"+asaCh.spend.toFixed(2),"var(--red)");
    html+=row("Installs",asaCh.installs,"var(--green)");
    html+=row("CPI",asaCh.cpi!==null?"$"+asaCh.cpi.toFixed(2):"—","var(--blue)");
  } else {
    html+='<div style="font-size:10px;color:var(--muted);padding:8px 0">No ASA spend data yet. Seed via POST /api/dashboard/ad-metrics.<br><br>';
    html+='<strong style="color:var(--text)">Planned campaigns:</strong><br>';
    html+='Brand: $3/day | Category: $6/day | Competitor: $5/day | Discovery: $2.50/day<br>';
    html+='Total: $16.50/day ($500/mo)</div>';
  }
  html+='</div></div>';

  // Meta Ad Hierarchy: Campaign → Ad Set → Ad (expandable)
  var hierarchy=GR.meta_hierarchy||[];
  if(hierarchy.length>0){
    html+='<div class="cd"><h3>Meta Ads Breakdown</h3>';
    html+='<table class="tbl" style="border-collapse:collapse">';
    html+='<tr><th style="text-align:left">Name</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>Installs</th><th>Trials</th><th>CPI</th><th>CTR</th></tr>';
    hierarchy.forEach(function(camp,ci){
      var cid='camp_'+ci;
      // Campaign row
      html+='<tr style="cursor:pointer;background:var(--card)" onclick="var el=document.querySelectorAll(\'.\'+\''+cid+'\');el.forEach(function(e){e.style.display=e.style.display===\'none\'?\'table-row\':\'none\'})">';
      html+='<td style="text-align:left;font-weight:700;font-size:11px">▸ '+camp.name+'</td>';
      html+=metaRowCells(camp);
      html+='</tr>';
      // Ad set rows (hidden by default)
      (camp.adsets||[]).forEach(function(adset,asi){
        var asid=cid+'_as'+asi;
        html+='<tr class="'+cid+'" style="display:none;cursor:pointer;background:rgba(94,60,36,.03)" onclick="event.stopPropagation();var el=document.querySelectorAll(\'.\'+\''+asid+'\');el.forEach(function(e){e.style.display=e.style.display===\'none\'?\'table-row\':\'none\'})">';
        html+='<td style="text-align:left;font-weight:600;font-size:10px;padding-left:20px">▸ '+adset.name+'</td>';
        html+=metaRowCells(adset);
        html+='</tr>';
        // Ad rows (hidden by default)
        (adset.ads||[]).forEach(function(ad){
          html+='<tr class="'+cid+' '+asid+'" style="display:none;background:rgba(94,60,36,.06)">';
          html+='<td style="text-align:left;font-size:10px;padding-left:40px">'+ad.name+'</td>';
          html+=metaRowCells(ad);
          html+='</tr>';
        });
      });
    });
    html+='</table></div>';
  }

  // CSV Drop Zone for Apple Search Ads
  html+='<div class="cd"><h3>Import Apple Search Ads</h3>';
  html+='<div id="asaCsvDrop" class="csv-drop" onclick="document.getElementById(\'asaCsvFile\').click()">';
  html+='<div class="csv-icon">&#128196;</div>';
  html+='<div class="csv-label">Drop Apple Ads CSV here</div>';
  html+='<div class="csv-sub">or click to browse &middot; exported from searchads.apple.com</div>';
  html+='</div>';
  html+='<input type="file" id="asaCsvFile" accept=".csv" style="display:none">';
  html+='<div id="asaCsvMsg"></div>';
  html+='</div>';

  html+='<div class="g2"><div class="cd"><h3>Unit Economics</h3>';
  html+=row("CPA (Cost per Paying Sub)",u.cpa!==null?"$"+u.cpa.toFixed(2):"—","var(--red)");
  html+=row("LTV (Lifetime Value)",u.ltv!==null?"$"+u.ltv.toFixed(2):"—","var(--green)");
  html+=row("Avg Revenue / Sub / Mo",u.avg_revenue_per_sub!==null?"$"+u.avg_revenue_per_sub.toFixed(2):"—","var(--gold)");
  html+=row("Monthly Churn Rate",u.monthly_churn_rate!==null?(u.monthly_churn_rate*100).toFixed(1)+"%":"—","var(--orange)");
  html+=row("ROAS (30d)",u.roas!==null?u.roas.toFixed(2)+"x":"—","var(--blue)");
  html+=row("Payback Period",u.payback_months!==null?u.payback_months.toFixed(1)+" months":"—","var(--purple)");
  html+=row("Active Subscribers",u.active_subscribers||0,"var(--green)");
  html+=row("Revenue (30d)","$"+(u.revenue_30d||0).toFixed(2),"var(--gold)");
  html+='</div>';

  html+='<div class="cd"><h3>Viral Loop</h3>';
  html+=row("Prayer Circles",v.circles||0,"var(--blue)");
  html+=row("Total Circle Members",v.total_circle_members||0,"var(--indigo)");
  html+=row("Avg Members / Circle",(v.avg_members_per_circle||0).toFixed(1),"var(--teal)");
  html+=row("Invite Tokens Created",v.invite_tokens_created||0,"var(--orange)");
  html+=row("Invites Accepted",v.invite_tokens_accepted||0,"var(--green)");
  html+=row("Acceptance Rate",Math.round((v.acceptance_rate||0)*100)+"%","var(--gold)");
  html+=row("Avg Invites / User",(v.avg_invites_per_user||0).toFixed(2),"var(--purple)");
  html+=row("Viral Coefficient (K)",(v.viral_k||0).toFixed(2),v.viral_k>=0.5?"var(--green)":v.viral_k>=0.2?"var(--yellow)":"var(--red)");
  html+='</div></div>';

  if(cr.length){
    html+='<div class="cd"><h3>Cohort Retention</h3>';
    html+='<table class="cohort-tbl"><tr><th style="text-align:left">Cohort Week</th><th>Users</th><th>D1</th><th>D7</th><th>D14</th><th>D30</th></tr>';
    cr.forEach(function(c){
      var week=c.week?new Date(c.week).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—';
      function retCell(pct){var clr=pct>=40?'var(--green)':pct>=25?'var(--orange)':'var(--red)';return'<td style="color:'+clr+'">'+pct+'%</td>'}
      html+='<tr><td>'+week+'</td><td class="mono">'+c.cohort_size+'</td>'+retCell(c.d1_pct)+retCell(c.d7_pct)+retCell(c.d14_pct)+retCell(c.d30_pct)+'</tr>';
    });
    html+='</table></div>';
  }

  if(sd.length){
    html+='<div class="cd"><h3>Streak Distribution</h3>';
    var maxStreak=Math.max.apply(null,sd.map(function(s){return s.count}));
    sd.forEach(function(s){
      var w=maxStreak>0?Math.round(s.count/maxStreak*100):0;
      var clr=s.range==='0'?'var(--red)':s.range==='31+'?'var(--green)':'var(--gold)';
      html+='<div class="br"><div class="bl"><span class="bn">'+s.range+' days</span><span class="bc">'+s.count+' users</span></div><div class="bt"><div class="bf" style="width:'+w+'%;background:'+clr+'"></div></div></div>';
    });
    html+='</div>';
  }

  return html;
}

// ═══════════════════════════════════════════════════════════════
// ─── ORGANIC TAB ───────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function rOg(){
  if(!OG)return'<div class="note">Organic data loading...</div>';
  var yt=OG.youtube||{};
  var stored=OG.stored_metrics||[];

  var html='';

  if(yt.channel_id||yt.subscriber_count){
    html+='<div class="cd" style="border-color:rgba(168,79,62,.25)"><h3>Father John · YouTube · @fatherjohnprays</h3>';
    var totalLikes=0,totalComments=0,totalViews2=0;
    if(yt.recent_videos){yt.recent_videos.forEach(function(v){totalLikes+=parseInt(v.likes||v.likeCount||0);totalComments+=parseInt(v.comments||v.commentCount||0);totalViews2+=parseInt(v.views||v.viewCount||0)})}
    var totalEng=totalViews2>0?((totalLikes+totalComments)/totalViews2*100).toFixed(1):'0';
    html+='<div class="kg" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
      kpi("Subscribers",parseInt(yt.subscriber_count||0).toLocaleString(),"var(--red)")+
      kpi("Total Views",parseInt(yt.view_count||0).toLocaleString(),"var(--blue)")+
      kpi("Videos",parseInt(yt.video_count||0),"var(--purple)")+
      kpi("Total Likes",totalLikes.toLocaleString(),"var(--green)")+
      kpi("Total Comments",totalComments.toLocaleString(),"var(--muted)")+
      kpi("Eng. Rate",totalEng+"%","var(--gold)")+
    '</div></div>';
  }

  if(yt.recent_videos&&yt.recent_videos.length){
    // Add engagement rate and sort
    var vids=yt.recent_videos.map(function(v){
      var views=parseInt(v.views||v.viewCount||0);var likes=parseInt(v.likes||v.likeCount||0);var comments=parseInt(v.comments||v.commentCount||0);
      return{title:v.title,views:views,likes:likes,comments:comments,engagement:views>0?((likes+comments)/views*100):0,published:v.published_at||v.publishedAt};
    });
    vids.sort(function(a,b){var va=a[YT_SORT]||0,vb=b[YT_SORT]||0;return YT_SORT_DIR==='desc'?vb-va:va-vb});
    function ytSortHdr(label,field){var arrow=YT_SORT===field?(YT_SORT_DIR==='desc'?' v':' ^'):'';return'<th style="cursor:pointer" onclick="YT_SORT=\''+field+'\';YT_SORT_DIR=YT_SORT_DIR===\'desc\'?\'asc\':\'desc\';render()">'+label+arrow+'</th>'}
    html+='<div class="cd"><h3>Father John · Recent Videos</h3>';
    html+='<table class="tbl"><tr><th>Title</th>'+ytSortHdr('Views','views')+ytSortHdr('Likes','likes')+ytSortHdr('Comments','comments')+ytSortHdr('Eng. Rate','engagement')+'<th>Published</th></tr>';
    vids.forEach(function(v){
      html+='<tr><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+v.title+'</td><td class="mono" style="color:var(--blue)">'+v.views.toLocaleString()+'</td><td class="mono" style="color:var(--green)">'+v.likes.toLocaleString()+'</td><td class="mono">'+v.comments.toLocaleString()+'</td><td class="mono" style="color:var(--gold)">'+v.engagement.toFixed(1)+'%</td><td class="mono" style="color:var(--muted)">'+new Date(v.published).toLocaleDateString()+'</td></tr>';
    });
    html+='</table></div>';
  }

  if(stored.length){
    var channels={};
    stored.forEach(function(r){if(!channels[r.channel])channels[r.channel]=[];channels[r.channel].push(r)});
    Object.keys(channels).forEach(function(ch){
      var rows=channels[ch];
      var totalViews=rows.reduce(function(s,r){return s+(r.views||0)},0);
      var totalLikes=rows.reduce(function(s,r){return s+(r.likes||0)},0);
      var totalComments=rows.reduce(function(s,r){return s+(r.comments||0)},0);
      var totalSubs=rows.reduce(function(s,r){return s+(r.subscribers_gained||0)},0);
      html+='<div class="cd"><h3>'+ch.charAt(0).toUpperCase()+ch.slice(1)+' (stored metrics)</h3>';
      html+='<div class="kg" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">'+
        kpi("Views",totalViews.toLocaleString(),"var(--blue)")+
        kpi("Likes",totalLikes.toLocaleString(),"var(--green)")+
        kpi("Comments",totalComments.toLocaleString(),"var(--purple)")+
        kpi("Subs Gained",totalSubs.toLocaleString(),"var(--gold)")+
      '</div>';
      html+='<table class="tbl"><tr><th>Date</th><th>Views</th><th>Likes</th><th>Comments</th><th>Shares</th><th>Subs</th></tr>';
      rows.slice(0,14).forEach(function(r){
        html+='<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="mono">'+r.views+'</td><td class="mono">'+r.likes+'</td><td class="mono">'+r.comments+'</td><td class="mono">'+r.shares+'</td><td class="mono" style="color:var(--green)">'+r.subscribers_gained+'</td></tr>';
      });
      html+='</table></div>';
    });
  }

  // TikTok section
  var tt=OG.tiktok||{};
  if(tt.username||tt.followers){
    var ttTotalViews=0,ttTotalLikes=0,ttTotalComments=0,ttTotalShares=0;
    if(tt.recent_videos){tt.recent_videos.forEach(function(v){ttTotalViews+=parseInt(v.views||0);ttTotalLikes+=parseInt(v.likes||0);ttTotalComments+=parseInt(v.comments||0);ttTotalShares+=parseInt(v.shares||0)})}
    var ttEng=ttTotalViews>0?((ttTotalLikes+ttTotalComments+ttTotalShares)/ttTotalViews*100).toFixed(1):'0';
    html+='<div class="cd" style="border-color:rgba(94,60,36,.25)"><h3>prAmen · TikTok · @'+tt.username+'</h3>';
    html+='<div class="kg" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
      kpi("Followers",parseInt(tt.followers||0).toLocaleString(),"var(--text)")+
      kpi("Videos",parseInt(tt.video_count||0),"var(--purple)")+
      kpi("Total Views",ttTotalViews.toLocaleString(),"var(--blue)")+
      kpi("Total Likes",ttTotalLikes.toLocaleString(),"var(--red)")+
      kpi("Total Comments",ttTotalComments.toLocaleString(),"var(--muted)")+
      kpi("Eng. Rate",ttEng+"%","var(--gold)")+
    '</div></div>';
  }
  if(tt.recent_videos&&tt.recent_videos.length){
    var ttVids=tt.recent_videos.map(function(v){
      var views=parseInt(v.views||0),likes=parseInt(v.likes||0),comments=parseInt(v.comments||0),shares=parseInt(v.shares||0);
      return{title:v.title||'Untitled',views:views,likes:likes,comments:comments,shares:shares,engagement:views>0?((likes+comments+shares)/views*100):0,created_at:v.created_at};
    });
    ttVids.sort(function(a,b){var va=a[TT_SORT]||0,vb=b[TT_SORT]||0;if(TT_SORT==='created_at'){va=new Date(a.created_at).getTime();vb=new Date(b.created_at).getTime()}return TT_SORT_DIR==='desc'?vb-va:va-vb});
    function ttSortHdr(label,field){var arrow=TT_SORT===field?(TT_SORT_DIR==='desc'?' v':' ^'):'';return'<th style="cursor:pointer" onclick="TT_SORT=\''+field+'\';TT_SORT_DIR=TT_SORT_DIR===\'desc\'?\'asc\':\'desc\';render()">'+label+arrow+'</th>'}
    html+='<div class="cd"><h3>prAmen · Recent TikTok Videos</h3>';
    html+='<table class="tbl"><tr><th>Title</th>'+ttSortHdr('Views','views')+ttSortHdr('Likes','likes')+ttSortHdr('Comments','comments')+ttSortHdr('Shares','shares')+ttSortHdr('Eng. Rate','engagement')+ttSortHdr('Posted','created_at')+'</tr>';
    ttVids.forEach(function(v){
      html+='<tr><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+v.title+'</td><td class="mono" style="color:var(--blue)">'+v.views.toLocaleString()+'</td><td class="mono" style="color:var(--red)">'+v.likes.toLocaleString()+'</td><td class="mono">'+v.comments.toLocaleString()+'</td><td class="mono">'+v.shares.toLocaleString()+'</td><td class="mono" style="color:var(--gold)">'+v.engagement.toFixed(1)+'%</td><td class="mono" style="color:var(--muted)">'+new Date(v.created_at).toLocaleDateString()+'</td></tr>';
    });
    html+='</table></div>';
  }

  // Instagram section
  var ig=OG.instagram||{};
  if(ig.account_id||ig.username){
    var igTotalLikes=0,igTotalComments=0,igTotalViews=0;
    if(ig.recent_posts){ig.recent_posts.forEach(function(p){igTotalLikes+=parseInt(p.likes||0);igTotalComments+=parseInt(p.comments||0);igTotalViews+=parseInt(p.views||0)})}
    var igTotalEng=igTotalLikes+igTotalComments;
    var igFollowers=parseInt(ig.followers||0);
    var igEngRate=igFollowers>0?((igTotalEng/ig.recent_posts.length)/igFollowers*100).toFixed(1):'0';
    html+='<div class="cd" style="border-color:rgba(154,104,72,.25)"><h3>prAmen · Instagram · @'+ig.username+'</h3>';
    html+='<div class="kg" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
      kpi("Followers",igFollowers.toLocaleString(),"var(--orange)")+
      kpi("Posts",parseInt(ig.media_count||0),"var(--purple)")+
      kpi("Total Views",igTotalViews.toLocaleString(),"var(--blue)")+
      kpi("Total Likes",igTotalLikes.toLocaleString(),"var(--red)")+
      kpi("Total Comments",igTotalComments.toLocaleString(),"var(--muted)")+
      kpi("Eng. Rate",igEngRate+"%","var(--gold)")+
    '</div></div>';
  }
  if(ig.recent_posts&&ig.recent_posts.length){
    var igPosts=ig.recent_posts.map(function(p){
      var type=p.media_product_type==='REELS'?'REEL':(p.media_type||'');
      var v=parseInt(p.views||0),l=parseInt(p.likes||0),cm=parseInt(p.comments||0);
      var eng=v>0?((l+cm)/v*100):(igFollowers>0?((l+cm)/igFollowers*100):0);
      return{caption:p.caption,type:type,views:v,likes:l,comments:cm,engagement:eng,timestamp:p.timestamp};
    });
    // Type filter
    var igTypes={};igPosts.forEach(function(p){igTypes[p.type]=true});
    var igFiltered=IG_TYPE_FILTER==='all'?igPosts:igPosts.filter(function(p){return p.type===IG_TYPE_FILTER});
    // Sort
    igFiltered.sort(function(a,b){var va=a[IG_SORT]||0,vb=b[IG_SORT]||0;if(IG_SORT==='timestamp'){va=new Date(a.timestamp).getTime();vb=new Date(b.timestamp).getTime()}return IG_SORT_DIR==='desc'?vb-va:va-vb});
    function igSortHdr(label,field){var arrow=IG_SORT===field?(IG_SORT_DIR==='desc'?' v':' ^'):'';return'<th style="cursor:pointer" onclick="IG_SORT=\''+field+'\';IG_SORT_DIR=IG_SORT_DIR===\'desc\'?\'asc\':\'desc\';render()">'+label+arrow+'</th>'}
    html+='<div class="cd"><h3>prAmen · Recent Instagram Posts</h3>';
    html+='<div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">';
    html+='<button class="filter-chip'+(IG_TYPE_FILTER==='all'?' on':'')+'" onclick="IG_TYPE_FILTER=\'all\';render()">All</button>';
    Object.keys(igTypes).sort().forEach(function(t){html+='<button class="filter-chip'+(IG_TYPE_FILTER===t?' on':'')+'" onclick="IG_TYPE_FILTER=\''+t+'\';render()">'+t+'</button>'});
    html+='</div>';
    html+='<table class="tbl"><tr><th>Caption</th><th>Type</th>'+igSortHdr('Views','views')+igSortHdr('Likes','likes')+igSortHdr('Comments','comments')+igSortHdr('Eng. Rate','engagement')+igSortHdr('Posted','timestamp')+'</tr>';
    igFiltered.forEach(function(p){
      var igEng=p.views>0?((p.likes+p.comments)/p.views*100).toFixed(1):(igFollowers>0?((p.likes+p.comments)/igFollowers*100).toFixed(1):'0');
      html+='<tr><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.caption+'</td><td class="mono" style="color:var(--muted)">'+p.type+'</td><td class="mono" style="color:var(--blue)">'+(p.views>0?p.views.toLocaleString():'-')+'</td><td class="mono" style="color:var(--orange)">'+p.likes.toLocaleString()+'</td><td class="mono">'+p.comments.toLocaleString()+'</td><td class="mono" style="color:var(--gold)">'+igEng+'%</td><td class="mono" style="color:var(--muted)">'+new Date(p.timestamp).toLocaleDateString()+'</td></tr>';
    });
    html+='</table></div>';
  }

  if(!yt.channel_id&&!yt.subscriber_count&&!ig.account_id&&!stored.length){
    html+='<div class="note">No organic data yet. YouTube auto-pulls on each page load. TikTok will appear once API access is configured.</div>';
  }

  return html;
}

async function grantTrial(){
  var email = document.getElementById('grant-email').value.trim();
  var userId = document.getElementById('grant-userid').value.trim();
  var duration = document.getElementById('grant-duration').value;
  var reason = document.getElementById('grant-reason').value.trim();
  var status = document.getElementById('grant-status');
  if (!email && !userId) { status.textContent = 'Enter an email or user ID'; status.style.color = 'var(--red)'; return; }
  status.textContent = 'Granting...'; status.style.color = 'var(--muted)';
  try {
    var body = { duration: duration, reason: reason || 'dashboard grant' };
    if (email) body.email = email;
    if (userId) body.userId = userId;
    var res = await fetch(B + '/api/admin/grant-trial?key=' + K, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = await res.json();
    if (res.ok && data.success) {
      status.textContent = 'Granted ' + data.durationLabel + ' to ' + (email || data.userId); status.style.color = 'var(--green)';
      GRANT_LOG.push({ time: new Date().toLocaleTimeString(), email: email, userId: data.userId, duration: data.durationLabel, reason: reason, ok: true });
      document.getElementById('grant-email').value = '';
      document.getElementById('grant-userid').value = '';
      document.getElementById('grant-reason').value = '';
      render();
    } else {
      status.textContent = data.error || 'Failed'; status.style.color = 'var(--red)';
      GRANT_LOG.push({ time: new Date().toLocaleTimeString(), email: email, userId: userId, duration: duration, reason: reason, ok: false, error: data.error || 'Failed' });
      render();
    }
  } catch (e) { status.textContent = 'Network error'; status.style.color = 'var(--red)'; }
}

  try {
    var res = await fetch(B + '/api/admin/promo-codes/generate?key=' + K, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ count: parseInt(count), duration: duration, campaign: campaign, expiresInDays: expiresInDays }) });

    if (res.ok && data.success) {
      PROMO_GENERATED = data.codes;

}

function copyCode(el){
  navigator.clipboard.writeText(el.textContent.trim());
  var orig = el.style.background;
  el.style.background = 'rgba(122,138,104,.3)';
  setTimeout(function(){ el.style.background = orig; }, 400);
}

function copyAllPromo(){
  var text = PROMO_GENERATED.join('\n');

  var status = document.getElementById('promo-status');
  status.textContent = 'All codes copied!'; status.style.color = 'var(--green)';

// ─── ASA CSV Upload ──────────────────────────────────────────
function initAsaCsvDrop(){
  var drop=document.getElementById('asaCsvDrop');
  var inp=document.getElementById('asaCsvFile');
  if(!drop||!inp)return;
  drop.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();drop.classList.add('dragover')});
  drop.addEventListener('dragleave',function(e){e.preventDefault();e.stopPropagation();drop.classList.remove('dragover')});
  drop.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();drop.classList.remove('dragover');if(e.dataTransfer.files.length)handleAsaCsv(e.dataTransfer.files[0])});
  inp.addEventListener('change',function(){if(inp.files.length){handleAsaCsv(inp.files[0]);inp.value=''}});
}

function handleAsaCsv(file){
  var msgEl=document.getElementById('asaCsvMsg');
  msgEl.innerHTML='<div class="csv-msg csv-msg-ok">Parsing...</div>';
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var text=e.target.result;
      var lines=text.split(/\r?\n/);
      // Extract date range from header lines
      var startDate='',endDate='';
      for(var i=0;i<Math.min(5,lines.length);i++){
        var sl=lines[i].replace(/"/g,'').trim();
        if(sl.indexOf('Start Date:')===0)startDate=sl.replace('Start Date:','').trim();
        if(sl.indexOf('End Date:')===0)endDate=sl.replace('End Date:','').trim();
      }
      // Find the header row (line with "Campaign ID")
      var headerIdx=-1;
      for(var i=0;i<Math.min(10,lines.length);i++){
        if(lines[i].indexOf('Campaign ID')!==-1){headerIdx=i;break}
      }
      if(headerIdx===-1){msgEl.innerHTML='<div class="csv-msg csv-msg-err">Could not find CSV header row (expected "Campaign ID" column).</div>';return}
      // Parse header to find column indices
      var headers=parseCsvRow(lines[headerIdx]);
      var colMap={};
      headers.forEach(function(h,idx){colMap[h.trim()]=idx});
      var nameIdx=colMap['Campaign Name'];
      var spendIdx=colMap['Spend'];
      var impIdx=colMap['Impressions'];
      var tapIdx=colMap['Taps'];
      var installIdx=colMap['Installs (Total)'];
      var dlIdx=colMap['New Downloads (Total)'];
      if(nameIdx===undefined||spendIdx===undefined){msgEl.innerHTML='<div class="csv-msg csv-msg-err">Missing required columns: Campaign Name, Spend</div>';return}
      // Determine the date to use (end date from header, or today)
      var useDate=endDate?parseAsaDate(endDate):new Date().toISOString().slice(0,10);
      // Parse campaign rows
      var entries=[];
      for(var i=headerIdx+1;i<lines.length;i++){
        var line=lines[i].trim();
        if(!line)continue;
        var cols=parseCsvRow(line);
        if(!cols[nameIdx])continue;
        var campName=cols[nameIdx].trim();
        var spend=parseFloat((cols[spendIdx]||'0').replace(/[$,]/g,''))||0;
        var imps=parseInt((cols[impIdx]||'0').replace(/,/g,''))||0;
        var taps=parseInt((cols[tapIdx]||'0').replace(/,/g,''))||0;
        var installs=parseInt((cols[installIdx]||'0').replace(/,/g,''))||0;
        var downloads=parseInt((cols[dlIdx]||'0').replace(/,/g,''))||0;
        entries.push({date:useDate,channel:'asa',campaign:campName,spend:spend,impressions:imps,clicks:taps,installs:installs||downloads,trials:0,subscriptions:0});
      }
      if(!entries.length){msgEl.innerHTML='<div class="csv-msg csv-msg-err">No campaign rows found in CSV.</div>';return}
      // POST to ad-metrics endpoint
      fetch(B+'/api/dashboard/ad-metrics?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:entries})}).then(function(r){return r.json()}).then(function(resp){
        if(resp.error){msgEl.innerHTML='<div class="csv-msg csv-msg-err">Error: '+resp.error+'</div>';return}
        msgEl.innerHTML='<div class="csv-msg csv-msg-ok">Imported '+entries.length+' campaign'+(entries.length>1?'s':'')+' for '+useDate+' ('+resp.stored+' rows stored).</div>';
        setTimeout(function(){loadAll()},1000);
      }).catch(function(err){msgEl.innerHTML='<div class="csv-msg csv-msg-err">Network error: '+err.message+'</div>'});
    }catch(ex){msgEl.innerHTML='<div class="csv-msg csv-msg-err">Parse error: '+ex.message+'</div>'}
  };
  reader.readAsText(file);
}

function parseAsaDate(str){
  // Parse "May 04, 2026" -> "2026-05-04"
  var months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  var parts=str.replace(/,/g,'').split(/\s+/);
  if(parts.length>=3&&months[parts[0]]){return parts[2]+'-'+months[parts[0]]+'-'+parts[1].padStart(2,'0')}
  var d=new Date(str);return isNaN(d)?new Date().toISOString().slice(0,10):d.toISOString().slice(0,10);
}

function parseCsvRow(line){
  // Handle quoted CSV fields properly
  var result=[];var current='';var inQuotes=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(inQuotes){
      if(ch==='"'&&i+1<line.length&&line[i+1]==='"'){current+='"';i++}
      else if(ch==='"'){inQuotes=false}
      else{current+=ch}
    }else{
      if(ch==='"'){inQuotes=true}
      else if(ch===','){result.push(current);current=''}
      else{current+=ch}
    }
  }
  result.push(current);
  return result;
}
