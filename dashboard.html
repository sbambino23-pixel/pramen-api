<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>prAmen — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#111118;--border:#1c1c26;--gold:#C9A44A;--text:#d4d0c8;--muted:#5a5a68;--green:#22c55e;--red:#ef4444;--blue:#06b6d4;--pink:#ec4899;--purple:#8b5cf6;--orange:#f97316;--teal:#14b8a6;--indigo:#6366f1;--yellow:#eab308}
*{margin:0;padding:0;box-sizing:border-box}::selection{background:var(--gold);color:var(--bg)}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:3px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;padding:14px 18px;min-height:100vh}.c{max-width:1400px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border)}.hdr h1{font-size:20px;font-weight:700;color:var(--gold)}.hdr .sub{color:var(--muted);font-size:10px;margin-top:2px;font-family:'JetBrains Mono'}
.live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);font-weight:600}.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
/* Date range bar */
.dr-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.dr-btn{padding:4px 10px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;font-family:'DM Sans';transition:all .15s}.dr-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}.dr-btn.active{border-color:var(--gold);background:rgba(201,164,74,.08);color:var(--gold)}
.dr-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.dr-label{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.dr-dates{font-size:10px;color:var(--muted);font-family:'JetBrains Mono';margin-left:auto}
.cmp-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 10px;border-radius:5px;border:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:600;transition:all .15s}.cmp-toggle:hover{border-color:var(--gold);color:var(--text)}.cmp-toggle.on{border-color:var(--blue);color:var(--blue);background:rgba(6,182,212,.06)}.cmp-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:all .15s}.cmp-toggle.on .cmp-dot{background:var(--blue)}
/* Tabs */
.tabs{display:flex;gap:3px;flex-wrap:wrap}.tab{padding:5px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;font-family:'DM Sans'}.tab:hover{color:var(--text);background:var(--card)}.tab.active{border-color:var(--gold);background:rgba(201,164,74,.06);color:var(--gold)}
/* KPI grid */
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:14px}.k{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;position:relative}.k .l{font-size:8px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}.k .v{font-size:22px;font-weight:700;font-family:'JetBrains Mono';letter-spacing:-.5px}
.k .delta{position:absolute;top:10px;right:10px;font-size:9px;font-weight:700;font-family:'JetBrains Mono';padding:1px 5px;border-radius:3px}
.delta-up{color:var(--green);background:rgba(34,197,94,.1)}.delta-down{color:var(--red);background:rgba(239,68,68,.1)}.delta-flat{color:var(--muted);background:rgba(255,255,255,.03)}
/* Layout helpers */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}.cd h3{font-size:10px;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tr{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:rgba(255,255,255,.02);border-radius:5px;margin-bottom:3px}.tr:hover{background:rgba(255,255,255,.04)}.tr .n{font-size:11px}.tr .ct{font-size:15px;font-weight:700;font-family:'JetBrains Mono'}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:10px}.tbl th{text-align:left;padding:6px 8px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase;letter-spacing:.5px}.tbl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.03)}.tbl tr:hover td{background:rgba(255,255,255,.02)}.mono{font-family:'JetBrains Mono';font-size:10px}
/* Users layout */
.ug{display:grid;grid-template-columns:240px 1fr;gap:10px}.ui{padding:6px 8px;border-radius:5px;margin-bottom:2px;cursor:pointer;background:rgba(255,255,255,.02);border:1px solid transparent;font-size:10px}.ui:hover{border-color:var(--border)}.ui.ac{border-color:rgba(201,164,74,.25);background:rgba(201,164,74,.04)}.ud{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px}.uid{font-family:'JetBrains Mono';font-weight:500;font-size:9px}.um{display:flex;gap:4px;font-size:7px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
/* Events */
.el{max-height:520px;overflow-y:auto}.ei{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02)}.ed{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}.en{font-size:11px;font-weight:500}.et{font-size:8px;color:var(--muted);font-family:'JetBrains Mono'}.tg{display:flex;gap:3px;margin-top:1px;flex-wrap:wrap}.tg span{font-size:8px}
/* Search */
.search-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.search-input{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:11px;font-family:'DM Sans';outline:none;flex:1;min-width:160px}.search-input:focus{border-color:var(--gold)}.search-input::placeholder{color:var(--muted)}
.filter-chip{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans'}.filter-chip:hover{border-color:var(--text);color:var(--text)}.filter-chip.on{border-color:var(--gold);color:var(--gold);background:rgba(201,164,74,.06)}
/* Funnel */
.fs{margin-bottom:8px}.fh{display:flex;justify-content:space-between;margin-bottom:3px;align-items:center}.fn{width:18px;height:18px;border-radius:50%;background:rgba(201,164,74,.1);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:4px}.fl{font-size:11px;font-weight:600}.fc{font-size:14px;font-weight:700;color:var(--gold);font-family:'JetBrains Mono'}.fd{font-size:9px;color:var(--red);margin-right:6px;font-weight:600}.fba{height:22px;background:rgba(255,255,255,.03);border-radius:5px;overflow:hidden;position:relative}.ff{height:100%;border-radius:5px}.fp{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:700;font-family:'JetBrains Mono'}
.f-step-rate{font-size:8px;color:var(--muted);text-align:center;padding:2px 0;font-family:'JetBrains Mono'}
/* Bars */
.br{margin-bottom:5px}.br .bl{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}.br .bn{font-weight:500}.br .bc{color:var(--muted);font-family:'JetBrains Mono';font-size:9px}.bt{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}.bf{height:100%;border-radius:2px}
/* Misc */
.loading{text-align:center;padding:60px;color:var(--muted)}.err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--red);font-size:11px}.note{background:rgba(201,164,74,.04);border:1px solid rgba(201,164,74,.12);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--gold);font-size:11px}
.rbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:9px;font-family:'DM Sans';font-weight:600}.rbtn:hover{border-color:var(--gold);color:var(--gold)}
.seg{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-size:7px;font-weight:700;letter-spacing:.3px}
.seg-power{background:rgba(34,197,94,.12);color:var(--green)}.seg-active{background:rgba(99,102,241,.12);color:var(--indigo)}.seg-new{background:rgba(6,182,212,.12);color:var(--blue)}.seg-dormant{background:rgba(239,68,68,.08);color:var(--red)}.seg-atrisk{background:rgba(249,115,22,.12);color:var(--orange)}
.ub{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;margin-top:3px;width:100%}.ubf{height:100%;border-radius:2px}
.usr-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:10px}
.usr-stat{background:rgba(255,255,255,.03);border-radius:5px;padding:6px 8px;text-align:center}.usr-stat .sv{font-size:16px;font-weight:700;font-family:'JetBrains Mono'}.usr-stat .sl{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.tgap{text-align:center;padding:3px 0;color:var(--muted);font-size:8px;font-family:'JetBrains Mono';opacity:.5;font-style:italic}
.usr-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.usr-name{font-size:14px;font-weight:700;color:var(--gold);font-family:'JetBrains Mono'}
.usr-meta{font-size:9px;color:var(--muted)}
.asc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600}.asc-ok{background:rgba(34,197,94,.1);color:var(--green)}.asc-no{background:rgba(239,68,68,.1);color:var(--red)}
/* Insights */
.insight{padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:11px;display:flex;align-items:center;gap:6px}.insight-warn{background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.15);color:var(--orange)}.insight-good{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.15);color:var(--green)}.insight-info{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);color:var(--indigo)}.insight-crit{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:var(--red)}
.insight-icon{font-size:14px;flex-shrink:0}
/* Sparkline (CSS only mini bar chart) */
.spark{display:flex;align-items:flex-end;gap:1px;height:24px}.spark-bar{flex:1;min-width:2px;border-radius:1px;background:var(--gold);opacity:.6;transition:all .15s}.spark-bar:hover{opacity:1}
@media(max-width:900px){.kg{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.ug{grid-template-columns:1fr}.dr-dates{display:none}}
</style>
</head>
<body>
<div class="c">
  <div class="hdr"><div><h1>🙏 prAmen</h1><p class="sub" id="ts">Loading...</p></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="live"><span class="dot"></span>LIVE</div><span id="asc-status" class="asc-badge asc-no">Apple: ...</span><button class="rbtn" onclick="loadAll()">↻ Refresh</button>
  <div class="tabs"><button class="tab active" onclick="go('overview',this)">Overview</button><button class="tab" onclick="go('funnel',this)">Funnel</button><button class="tab" onclick="go('users',this)">Users</button><button class="tab" onclick="go('events',this)">Events</button><button class="tab" onclick="go('revenue',this)">Revenue</button><button class="tab" onclick="go('web',this)">Web</button><button class="tab" onclick="go('circles',this)">Circles</button></div></div></div>
  <!-- Date Range Bar -->
  <div class="dr-bar">
    <span class="dr-label">Range</span>
    <button class="dr-btn" onclick="setRange(7,this)">7d</button>
    <button class="dr-btn active" onclick="setRange(14,this)">14d</button>
    <button class="dr-btn" onclick="setRange(30,this)">30d</button>
    <button class="dr-btn" onclick="setRange(90,this)">90d</button>
    <div class="dr-sep"></div>
    <div class="cmp-toggle" id="cmp-btn" onclick="toggleCompare()"><div class="cmp-dot"></div>Compare</div>
    <span class="dr-dates" id="dr-dates"></span>
  </div>
  <div id="main" class="loading">Connecting...</div>
</div>
<script>
var B=location.origin,K=new URLSearchParams(location.search).get("key")||"",
    D=null,PH=null,AP=null,RC=null,TAB="overview",SU=null,
    RANGE=14,COMPARE=false,EVT_SEARCH="",EVT_TYPE="all";

// Event colors & labels
var C={app_opened:"#6366f1",prayer_logged:"#f59e0b",paywall_viewed:"#ef4444",paywall_plan_selected:"#ec4899",onboarding_completed:"#22c55e",circle_created:"#06b6d4",circle_left:"#64748b",prayer_request_created:"#8b5cf6",share_tapped:"#14b8a6",scripture_viewed:"#a78bfa",circle_invite_accepted:"#06b6d4",circle_member_joined:"#22d3ee",encouragement_sent:"#14b8a6",user_signed_up:"#22c55e",account_deleted:"#ef4444",email_opt_in:"#34d399",streak_milestone:"#f59e0b"};
var L={app_opened:"App Open",prayer_logged:"Prayer",paywall_viewed:"Paywall",paywall_plan_selected:"Plan Tap",onboarding_completed:"Onboarding",circle_created:"Circle +",circle_left:"Circle Left",prayer_request_created:"Request",share_tapped:"Share",scripture_viewed:"Scripture",circle_invite_accepted:"Invite ✓",circle_member_joined:"Member +",encouragement_sent:"Encourage",user_signed_up:"Signup",account_deleted:"Delete",email_opt_in:"Email Opt-in",streak_milestone:"Streak 🔥"};

// ─── Date helpers ──────────────────────────────────────────────
function daysAgo(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}
function inRange(ts,from,to){var t=new Date(ts);return t>=from&&t<=to}
function fmtDate(d){return d.toISOString().split('T')[0]}
function fmtShort(d){return(d.getMonth()+1)+'/'+d.getDate()}
function updateDateLabel(){
  var now=new Date(),from=daysAgo(RANGE),to=now;
  var txt=fmtShort(from)+' – '+fmtShort(to);
  if(COMPARE){var pFrom=daysAgo(RANGE*2),pTo=daysAgo(RANGE);txt+='  vs  '+fmtShort(pFrom)+' – '+fmtShort(pTo)}
  document.getElementById('dr-dates').textContent=txt;
}

function setRange(n,el){RANGE=n;document.querySelectorAll('.dr-btn').forEach(function(b){b.classList.remove('active')});if(el)el.classList.add('active');updateDateLabel();render()}
function toggleCompare(){COMPARE=!COMPARE;var btn=document.getElementById('cmp-btn');btn.classList.toggle('on',COMPARE);updateDateLabel();render()}

// ─── Filter events by date range ──────────────────────────────
function filterByRange(events,rangeDays,offset){
  offset=offset||0;
  var from=daysAgo(rangeDays+offset),to=offset?daysAgo(offset):new Date();
  return events.filter(function(e){return inRange(e.timestamp,from,to)});
}

// ─── Delta calculation ────────────────────────────────────────
function calcDelta(current,previous){
  if(!COMPARE||previous===0)return null;
  return Math.round(((current-previous)/previous)*100);
}
function deltaHtml(d){
  if(d===null||d===undefined||!COMPARE)return'';
  if(d===0)return'<div class="delta delta-flat">—</div>';
  if(d>0)return'<div class="delta delta-up">↑'+d+'%</div>';
  return'<div class="delta delta-down">↓'+Math.abs(d)+'%</div>';
}

// ─── Navigation ───────────────────────────────────────────────
function go(t,el){TAB=t;SU=null;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});if(el)el.classList.add('active');render()}
function filterUser(uid){SU=uid;TAB="users";document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');if(b.textContent==="Users")b.classList.add('active')});render()}

// ─── Load all data ────────────────────────────────────────────
function loadAll(){
  var maxDays=Math.max(RANGE*2+7,90);
  Promise.all([
    fetch(B+"/api/dashboard?key="+K).then(function(r){return r.json()}),
    fetch(B+"/api/dashboard/events?key="+K+"&days="+maxDays+"&limit=1000").then(function(r){return r.json()}).catch(function(){return null}),
    fetch(B+"/api/dashboard/appstore?key="+K).then(function(r){return r.json()}).catch(function(){return null}),
    fetch(B+"/api/dashboard/revenuecat?key="+K).then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(r){
    D=r[0];PH=r[1]&&!r[1].error?r[1]:null;AP=r[2];RC=r[3]&&!r[3].error?r[3]:null;
    document.getElementById("ts").textContent=new Date().toLocaleString()+" • "+(PH?PH.total_events+" events • "+PH.total_users+" users":"PH: connecting...")+(RC?" • MRR: $"+(RC.summary?.net_mrr||0).toFixed(2):"");
    var ab=document.getElementById("asc-status");if(AP&&AP.connected){ab.className="asc-badge asc-ok";ab.textContent="Apple: ✓"}else{ab.className="asc-badge asc-no";ab.textContent="Apple: ✗"}
    updateDateLabel();render();
  }).catch(function(e){document.getElementById("main").innerHTML='<div class="err">'+e.message+'</div>'});
}

// ─── Get current + previous period events ──────────────────────
function getPeriodEvents(){
  if(!PH||!PH.recent_events)return{cur:[],prev:[],allEvents:[]};
  var all=PH.recent_events;
  var cur=filterByRange(all,RANGE,0);
  var prev=COMPARE?filterByRange(all,RANGE,RANGE):[];
  return{cur:cur,prev:prev,allEvents:all};
}

// ─── Compute metrics from events ──────────────────────────────
function computeMetrics(events){
  var users=new Set(),pTaps=0,prayers=0,signups=0,pwViews=0,circles=0,scrip=0,onboard=0,enc=0;
  var pwUsers=new Set(),ptUsers=new Set();
  var ec={},topics={},plans={},dauMap={};
  var fnSets={first_open:new Set(),onboarding:new Set(),paywall:new Set(),plan_tap:new Set(),prayer:new Set(),circle:new Set(),signup:new Set(),scripture:new Set()};
  for(var i=0;i<events.length;i++){
    var e=events[i];
    if(e.event==="$identify")continue;
    users.add(e.full_user_id);
    ec[e.event]=(ec[e.event]||0)+1;
    var d=e.timestamp.split('T')[0];if(!dauMap[d])dauMap[d]=new Set();dauMap[d].add(e.full_user_id);
    if(e.event==="paywall_plan_selected"){pTaps++;ptUsers.add(e.full_user_id);if(e.properties.plan)plans[e.properties.plan]=(plans[e.properties.plan]||0)+1;fnSets.plan_tap.add(e.full_user_id)}
    if(e.event==="prayer_logged"){prayers++;if(e.properties.type)topics[e.properties.type]=(topics[e.properties.type]||0)+1;fnSets.prayer.add(e.full_user_id)}
    if(e.event==="user_signed_up"){signups++;fnSets.signup.add(e.full_user_id)}
    if(e.event==="paywall_viewed"){pwViews++;pwUsers.add(e.full_user_id);fnSets.paywall.add(e.full_user_id)}
    if(e.event==="circle_created"){circles++;fnSets.circle.add(e.full_user_id)}
    if(e.event==="scripture_viewed"){scrip++;fnSets.scripture.add(e.full_user_id)}
    if(e.event==="onboarding_completed"){onboard++;fnSets.onboarding.add(e.full_user_id)}
    if(e.event==="encouragement_sent")enc++;
    if(e.properties.is_first_open===true||e.properties.is_first_open==="True")fnSets.first_open.add(e.full_user_id);
  }
  var dau=Object.entries(dauMap).map(function(x){return{date:x[0],dau:x[1].size}}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var avgDau=dau.length?Math.round(dau.reduce(function(s,x){return s+x.dau},0)/dau.length):0;
  return{users:users.size,pTaps:pTaps,prayers:prayers,signups:signups,pwViews:pwViews,circles:circles,scripture:scrip,onboarding:onboard,encouragements:enc,eventCounts:ec,topics:topics,plans:plans,dau:dau,avgDau:avgDau,totalEvents:events.length,funnel:fnSets,pwUsers:pwUsers.size,ptUsers:ptUsers.size};
}

// ─── Render ──────────────────────────────────────────────────
function render(){if(!D)return;var el=document.getElementById("main");switch(TAB){case"overview":el.innerHTML=rOv();break;case"funnel":el.innerHTML=rFn();break;case"users":el.innerHTML=rUs();break;case"events":el.innerHTML=rEv();break;case"revenue":el.innerHTML=rRv();break;case"web":el.innerHTML=rWb();break;case"circles":el.innerHTML=rCr();break}}

// ─── KPI helper with delta ────────────────────────────────────
function kpi(l,v,c,delta){return'<div class="k"><div class="l">'+l+'</div><div class="v" style="color:'+c+'">'+v+'</div>'+deltaHtml(delta)+'</div>'}
function row(n,v,c){return'<div class="tr"><span class="n">'+n+'</span><span class="ct" style="color:'+(c||'var(--gold)')+'">'+v+'</span></div>'}
function pct(a,b){return b>0?Math.round(a/b*100):0}

// ─── Insights generator ──────────────────────────────────────
function generateInsights(m,pm){
  var ins=[];
  // Paywall conversion
  if(m.pwUsers>0&&m.ptUsers>0){
    var conv=pct(m.ptUsers,m.pwUsers);
    if(conv<5)ins.push({type:'crit',icon:'🚨',text:'Paywall conversion at '+conv+'% ('+m.ptUsers+' unique tappers / '+m.pwUsers+' viewers). Fix pricing display and CTA.'});
    else if(conv<15)ins.push({type:'warn',icon:'⚠️',text:'Paywall conversion at '+conv+'%. Room to improve — test leading with Prayer Circles.'});
  }
  // Plan tap to purchase
  if(m.pTaps>10){
    var rc=RC?.summary||{};
    var purchases=rc.active_subscriptions||0;
    if(purchases===0)ins.push({type:'crit',icon:'💳',text:m.pTaps+' plan taps but 0 purchases tracked. Paywall is broken or RC IDs not linked.'});
  }
  // Circle engagement
  if(m.circles===0&&m.users>5)ins.push({type:'warn',icon:'👥',text:'No new circles created in this period. Push Circle feature in content and onboarding.'});
  if(m.encouragements>10)ins.push({type:'good',icon:'💬',text:m.encouragements+' encouragements sent — Circle engagement is healthy.'});
  // Growth
  if(COMPARE&&pm){
    if(pm.users>0){var userGrowth=pct(m.users-pm.users,pm.users);if(userGrowth>20)ins.push({type:'good',icon:'📈',text:'User base grew '+userGrowth+'% vs previous period.'});if(userGrowth<-10)ins.push({type:'warn',icon:'📉',text:'User base declined '+Math.abs(userGrowth)+'% vs previous period.'});}
    if(pm.prayers>0){var prayerGrowth=pct(m.prayers-pm.prayers,pm.prayers);if(prayerGrowth>20)ins.push({type:'good',icon:'🙏',text:'Prayers logged up '+prayerGrowth+'% — engagement increasing.'});}
  }
  // DAU
  if(m.avgDau>0&&m.avgDau<3)ins.push({type:'warn',icon:'📊',text:'Avg DAU is '+m.avgDau+'. Focus on push notifications and streak reminders.'});
  return ins;
}

  html+='</div>';
  // Event list
  html+='<div class="el" style="max-height:600px">'+filtered.slice(0,300).map(function(e){var t=new Date(e.timestamp);return'<div class="ei"><div class="ed" style="background:'+(C[e.event]||'var(--muted)')+'"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="en" style="color:'+(C[e.event]||'var(--text)')+'">'+(L[e.event]||e.event)+'</span><span class="et">'+t.toLocaleDateString()+' '+t.toLocaleTimeString()+'</span></div><div class="tg"><span class="uid" style="color:var(--muted);cursor:pointer" onclick="filterUser(\''+e.full_user_id+'\')">'+e.user+'</span>'+(e.properties.type?'<span style="color:var(--muted)">'+e.properties.type+'</span>':'')+(e.properties.plan?'<span style="color:var(--pink)">'+e.properties.plan+'</span>':'')+(e.properties.streak?'<span style="color:var(--green)">🔥'+e.properties.streak+'</span>':'')+(e.properties.city?'<span style="color:var(--muted)">📍'+e.properties.city+'</span>':'')+(e.properties.circle_name?'<span style="color:var(--blue)">'+e.properties.circle_name+'</span>':'')+'</div></div></div>'}).join('');
  if(filtered.length>300)html+='<div style="text-align:center;padding:10px;color:var(--muted);font-size:10px">Showing 300 of '+filtered.length+'</div>';
  html+='</div></div>';

  // Event type breakdown card
  html+='<div class="cd"><h3>Event Types ('+RANGE+'d)</h3><table class="tbl"><tr><th>Event</th><th>Count</th><th>% of Total</th><th>Unique Users</th></tr>';
  // Calculate unique users per event type
  var typeUsers={};evs.forEach(function(e){if(!typeUsers[e.event])typeUsers[e.event]=new Set();typeUsers[e.event].add(e.full_user_id)});
  html+=typeSorted.map(function(t){return'<tr><td style="color:'+(C[t[0]]||'var(--text)')+'">'+(L[t[0]]||t[0])+'</td><td class="mono">'+t[1]+'</td><td class="mono">'+Math.round(t[1]/evs.length*100)+'%</td><td class="mono">'+(typeUsers[t[0]]?typeUsers[t[0]].size:0)+'</td></tr>'}).join('');
  html+='</table></div>';
  return html;
}

// ═══════════════════════════════════════════════════════════════
// ─── REVENUE TAB ───────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function rRv(){
  var k=D.kpis,d=D.revenue.daily||[],ev=D.revenue.recent_events||[],rc=RC?.summary||{},subs=RC?.subscribers||[];
  var gross=rc.total_revenue_estimated||k.revenue_gross_30d||0;var net=gross*(1-0.15);
  return'<div class="kg">'+kpi("Revenue (Gross)","$"+gross.toFixed(2),"var(--orange)")+kpi("Revenue (Net)","$"+net.toFixed(2),"var(--gold)")+kpi("MRR (Net)","$"+(rc.net_mrr||0).toFixed(2),"var(--gold)")+kpi("Active Subs",rc.active_subscriptions||0,"var(--green)")+kpi("Active Trials",rc.active_trials||0,"var(--blue)")+kpi("Apple Cut","15%","var(--muted)")+'</div>'+
  (subs.length?'<div class="cd"><h3>Active Subscribers (from RevenueCat)</h3><table class="tbl"><tr><th>User</th><th>Product</th><th>Status</th><th>Purchased</th><th>Expires</th><th>Period</th></tr>'+subs.map(function(s){return s.subscriptions.map(function(sub){var active=sub.is_active;return'<tr><td class="mono" style="color:var(--gold)">'+(s.name||s.user_id.substring(0,12))+'</td><td class="mono">'+sub.product.replace("pramen_","")+'</td><td style="color:'+(active?"var(--green)":"var(--red)")+'">'+(active?(sub.period_type==="trial"?"Trial":"Active"):"Expired")+'</td><td class="mono">'+new Date(sub.purchase_date).toLocaleDateString()+'</td><td class="mono">'+new Date(sub.expires_date).toLocaleDateString()+'</td><td>'+sub.period_type+'</td></tr>'}).join('')}).join('')+'</table></div>':'<div class="note">RevenueCat subscriber data loading... The Rork fix (Purchases.shared.logIn) needs to deploy to link RC IDs to backend users.</div>')+
  (d.length?'<div class="cd"><h3>Daily Revenue (Webhook Log)</h3><table class="tbl"><tr><th>Date</th><th>New</th><th>Renew</th><th>Cancel</th><th>Gross</th><th>Net</th></tr>'+d.map(function(r){return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td style="color:var(--green)">'+r.new_subscribers+'</td><td>'+r.renewals+'</td><td style="color:var(--red)">'+r.cancellations+'</td><td class="mono">$'+(r.revenue_gross||0).toFixed(2)+'</td><td class="mono" style="color:var(--gold)">$'+(r.revenue_net||0).toFixed(2)+'</td></tr>'}).join('')+'</table></div>':'')+
  (ev.length?'<div class="cd"><h3>Transaction Log</h3><table class="tbl"><tr><th>Time</th><th>Event</th><th>Plan</th><th>Price</th><th>User</th></tr>'+ev.map(function(e){return'<tr><td class="mono">'+new Date(e.created_at).toLocaleString()+'</td><td>'+e.event_type+'</td><td>'+(e.plan||'—')+'</td><td class="mono" style="color:var(--gold)">$'+(e.price||0).toFixed(2)+'</td><td class="mono" style="color:var(--muted)">'+(e.user_id||'').substring(0,8)+'</td></tr>'}).join('')+'</table></div>':'')+'</div>'}

// ═══════════════════════════════════════════════════════════════
// ─── WEB TAB ───────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function rWb(){
  var d=D.web.daily||[],asd=AP?.daily_metrics||[],an=AP?.analytics||{};
  var totalDl=asd.reduce(function(s,r){return s+(r.app_units||0)},0);var totalImp=asd.reduce(function(s,r){return s+(r.impressions||0)},0);var totalPpv=asd.reduce(function(s,r){return s+(r.product_page_views||0)},0);var ascConv=totalPpv>0?((totalDl/totalPpv)*100).toFixed(1)+"%":"—";
  // Landing stats
  var tv=d.reduce(function(s,r){return s+(r.visitors||0)},0);var tc=d.reduce(function(s,r){return s+(r.app_store_clicks||0)},0);var lConv=tv>0?((tc/tv)*100).toFixed(1)+'%':'0%';
  return'<div class="kg">'+kpi("Visitors (30d)",tv,"var(--teal)")+kpi("App Store Clicks",tc,"var(--gold)")+kpi("Landing Conv.",lConv,"var(--green)")+kpi("Impressions",totalImp||"—","var(--indigo)")+kpi("Page Views",totalPpv||"—","var(--blue)")+kpi("Downloads",totalDl||"—","var(--green)")+kpi("Store Conv.",ascConv,"var(--pink)")+'</div>'+
  '<div class="cd"><h3>Daily Landing Page (Plausible — 30d)</h3>'+(d.length?'<table class="tbl"><tr><th>Date</th><th>Visitors</th><th>Views</th><th>Bounce</th><th>Duration</th><th>Clicks</th><th>Conv.</th></tr>'+d.map(function(r){var cv=r.visitors>0?((r.app_store_clicks/r.visitors)*100).toFixed(1)+"%":"—";return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="mono">'+r.visitors+'</td><td>'+r.pageviews+'</td><td>'+(r.bounce_rate||0).toFixed(0)+'%</td><td>'+(r.visit_duration_avg||0).toFixed(0)+'s</td><td style="color:var(--gold)">'+r.app_store_clicks+'</td><td style="color:var(--green)">'+cv+'</td></tr>'}).join('')+'</table>':'<div class="note">Plausible data loads hourly.</div>')+'</div>'+
  // Apple section
  (asd.length?'<div class="cd"><h3>Daily App Store (Apple Analytics)</h3><table class="tbl"><tr><th>Date</th><th>Impressions</th><th>Page Views</th><th>Downloads</th><th>Conv. Rate</th><th>Proceeds</th></tr>'+asd.map(function(r){return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="mono">'+r.impressions+'</td><td class="mono">'+r.product_page_views+'</td><td style="color:var(--green)" class="mono">'+r.app_units+'</td><td class="mono">'+(r.conversion_rate*100).toFixed(1)+'%</td><td class="mono" style="color:var(--gold)">$'+(r.proceeds||0).toFixed(2)+'</td></tr>'}).join('')+'</table></div>':
  '<div class="cd"><h3>Apple App Store Analytics</h3>'+
  '<div class="note" style="margin-bottom:8px">'+(an.status==="ok"?"Data parsed. Refresh to see.":an.status==="generating"?"Apple is generating reports. Data will appear within 24 hours.":"Reports requested — Apple is processing. Check back soon.")+
  (an.reports_available?' <br>Reports found: '+an.reports_available.join(", "):"")+
  '</div>'+
  '<div style="padding:8px;font-size:10px;color:var(--muted)"><strong style="color:var(--text)">From App Store Connect (manual reference):</strong><br>'+
  '• 27 first-time downloads, 9 redownloads<br>'+
  '• 211 impressions → 116 page views → 43.4% conversion rate<br>'+
  '• $21 proceeds, 4 in-app purchases, 3.45% Day 1 download-to-paid<br>'+
  '• 4 active plans, 1 paid plan<br>'+
  '<span style="color:var(--gold)">These numbers will auto-populate once Apple finishes generating report instances.</span></div></div>')+'</div>'}

// ═══════════════════════════════════════════════════════════════
// ─── CIRCLES TAB ───────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function rCr(){var cl=D.circles.circles||[];return'<div class="kg">'+kpi("Circles",D.circles.total,"var(--blue)")+kpi("Members",D.circles.total_members,"var(--indigo)")+kpi("Encouragements",D.circles.total_encouragements,"var(--teal)")+kpi("Requests",D.circles.total_prayer_requests,"var(--purple)")+'</div><div class="cd"><h3>All Prayer Circles</h3>'+(cl.length?'<table class="tbl"><tr><th>Name</th><th>Code</th><th>Members</th><th>Enc.</th><th>Req.</th><th>Created</th></tr>'+cl.map(function(c2){return'<tr><td><strong style="color:var(--text)">'+c2.name+'</strong></td><td class="mono" style="color:var(--gold)">'+c2.code+'</td><td class="mono">'+c2.members+'</td><td class="mono">'+c2.encouragements+'</td><td class="mono">'+c2.prayerRequests+'</td><td class="mono" style="color:var(--muted)">'+new Date(c2.createdAt).toLocaleDateString()+'</td></tr>'}).join('')+'</table>':'<div class="note">No circles.</div>')+'</div>'}

// ─── Init ────────────────────────────────────────────────────
updateDateLabel();loadAll();setInterval(loadAll,5*60*1000);
</script>
