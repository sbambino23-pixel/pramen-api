<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>prAmen Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#e2e0d8;font-family:'DM Sans',sans-serif;padding:16px;min-height:100vh}.c{max-width:1300px;margin:0 auto}.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}.hdr h1{font-size:24px;font-weight:700;color:#C9A44A}.hdr .sub{color:#555;font-size:11px;margin-top:2px}.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#22c55e}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.tabs{display:flex;gap:5px}.tab{padding:6px 12px;border-radius:7px;border:1px solid #1e1e28;background:#12121a;color:#555;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit}.tab.active{border-color:#C9A44A;background:rgba(201,164,74,.08);color:#C9A44A}.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}.k{background:#12121a;border:1px solid #1e1e28;border-radius:10px;padding:14px}.k .l{font-size:10px;color:#555;margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}.k .v{font-size:24px;font-weight:700;font-family:'JetBrains Mono'}.k .d{font-size:9px;margin-top:2px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.cd{background:#12121a;border:1px solid #1e1e28;border-radius:10px;padding:16px;margin-bottom:12px}.cd h3{font-size:12px;font-weight:600;margin-bottom:12px;color:#888}.tr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#1a1a24;border-radius:6px;margin-bottom:4px}.tr .n{font-size:11px}.tr .ct{font-size:16px;font-weight:700;font-family:'JetBrains Mono'}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th{text-align:left;padding:6px 8px;color:#888;font-weight:600;border-bottom:1px solid #1e1e28;font-size:10px;text-transform:uppercase}.tbl td{padding:6px 8px;border-bottom:1px solid #151520;color:#a0a0a0}.tbl tr:hover td{background:#1a1a24}.mono{font-family:'JetBrains Mono';font-size:11px}.gold{color:#C9A44A}.green{color:#22c55e}.red{color:#ef4444}.pink{color:#ec4899}.blue{color:#06b6d4}.purple{color:#8b5cf6}.loading{text-align:center;padding:60px;color:#555}.err{background:#ef444415;border:1px solid #ef444433;border-radius:8px;padding:12px;margin-bottom:16px;color:#ef4444;font-size:12px}.hidden{display:none}.refresh-btn{background:none;border:1px solid #2a2a35;color:#555;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}.refresh-btn:hover{border-color:#C9A44A;color:#C9A44A}@media(max-width:768px){.kg{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="c">
  <div class="hdr"><div><h1>🙏 prAmen Dashboard</h1><p class="sub" id="updated">Loading...</p></div>
  <div style="display:flex;align-items:center;gap:12px"><div class="live"><span class="dot"></span>Live</div><button class="refresh-btn" onclick="loadData()">Refresh</button>
  <div class="tabs"><button class="tab active" onclick="sT('overview',this)">Overview</button><button class="tab" onclick="sT('revenue',this)">Revenue</button><button class="tab" onclick="sT('web',this)">Web</button><button class="tab" onclick="sT('circles',this)">Circles</button></div></div></div>
  <div id="content" class="loading">Loading dashboard data...</div>
</div>
<script>
var API_BASE=window.location.origin;
var API_KEY=new URLSearchParams(window.location.search).get("key")||"";
var D=null,currentTab="overview";
function sT(t,el){currentTab=t;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});if(el)el.classList.add('active');render()}
function loadData(){
  fetch(API_BASE+"/api/dashboard?key="+API_KEY).then(function(r){if(!r.ok)throw new Error("API "+r.status);return r.json()}).then(function(d){D=d;document.getElementById("updated").textContent="Updated: "+new Date(D.generated_at).toLocaleTimeString();render()}).catch(function(e){document.getElementById("content").innerHTML='<div class="err">Failed: '+e.message+'</div>'})
}
function render(){if(!D)return;var el=document.getElementById("content");switch(currentTab){case"overview":el.innerHTML=rOverview();break;case"revenue":el.innerHTML=rRevenue();break;case"web":el.innerHTML=rWeb();break;case"circles":el.innerHTML=rCircles();break}}
function kpi(l,v,c,d){return'<div class="k"><div class="l">'+l+'</div><div class="v" style="color:'+c+'">'+v+'</div>'+(d?'<div class="d" style="color:#888">'+d+'</div>':'')+'</div>'}
function row(n,v,c){return'<div class="tr"><span class="n">'+n+'</span><span class="ct" style="color:'+(c||'#C9A44A')+'">'+v+'</span></div>'}
function rOverview(){var k=D.kpis,s=D.subscription_breakdown||{};return'<div class="kg">'+kpi("MRR (Net)","$"+(k.mrr_net||0).toFixed(2),"#C9A44A")+kpi("Total Users",k.total_users,"#22c55e")+kpi("Active Subs",(s.active||0)+(s.lifetime||0),"#06b6d4")+kpi("Trials",s.trial||0,"#f59e0b")+kpi("Circles",k.active_circles,"#8b5cf6")+kpi("Web Visitors 7d",k.landing_visitors_7d,"#ec4899")+kpi("App Store Clicks",k.landing_app_store_clicks_7d,"#14b8a6")+kpi("Landing Conv.",k.landing_conversion,"#6366f1")+'</div><div class="g2"><div class="cd"><h3>Subscription Status</h3>'+Object.entries(s).map(function(e){return row(e[0]||"none",e[1],e[0]==="active"?"#22c55e":"#888")}).join('')+'</div><div class="cd"><h3>Circle Summary</h3>'+row("Circles",D.circles.total,"#06b6d4")+row("Members",D.circles.total_members,"#6366f1")+row("Encouragements",D.circles.total_encouragements,"#14b8a6")+row("Prayer Requests",D.circles.total_prayer_requests,"#8b5cf6")+'</div></div><div class="cd"><h3>Revenue (30 Days)</h3><div class="kg" style="margin-bottom:0">'+kpi("Gross","$"+(k.revenue_gross_30d||0).toFixed(2),"#f59e0b")+kpi("Net","$"+(k.revenue_net_30d||0).toFixed(2),"#C9A44A")+kpi("New Subs",D.revenue.total_subscribers_30d||0,"#22c55e")+kpi("Cancels",D.revenue.total_cancellations_30d||0,"#ef4444")+'</div></div>'}
function rRevenue(){var d=D.revenue.daily||[],ev=D.revenue.recent_events||[];return'<div class="cd"><h3>Daily Revenue</h3>'+(d.length===0?'<p style="color:#555;font-size:12px">No revenue data yet. Will appear when subscriptions flow through RevenueCat.</p>':'<table class="tbl"><tr><th>Date</th><th>New</th><th>Renew</th><th>Cancel</th><th>Gross</th><th>Net</th></tr>'+d.map(function(r){return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="green">'+r.new_subscribers+'</td><td>'+r.renewals+'</td><td class="red">'+r.cancellations+'</td><td class="mono">$'+(r.revenue_gross||0).toFixed(2)+'</td><td class="mono gold">$'+(r.revenue_net||0).toFixed(2)+'</td></tr>'}).join('')+'</table>')+'</div><div class="cd"><h3>Recent Events</h3>'+(ev.length===0?'<p style="color:#555;font-size:12px">No events yet.</p>':'<table class="tbl"><tr><th>Time</th><th>Event</th><th>Plan</th><th>Price</th></tr>'+ev.map(function(e){return'<tr><td class="mono">'+new Date(e.created_at).toLocaleString()+'</td><td>'+e.event_type+'</td><td>'+(e.plan||'-')+'</td><td class="mono gold">$'+(e.price||0).toFixed(2)+'</td></tr>'}).join('')+'</table>')+'</div>'}
function rWeb(){var d=D.web.daily||[];return'<div class="cd"><h3>Landing Page (7 Days)</h3>'+(d.length===0?'<p style="color:#555;font-size:12px">Will populate once Plausible API key is set and hourly cron runs.</p>':'<table class="tbl"><tr><th>Date</th><th>Visitors</th><th>Views</th><th>Bounce</th><th>Duration</th><th>Clicks</th><th>Conv</th></tr>'+d.map(function(r){var cv=r.visitors>0?((r.app_store_clicks/r.visitors)*100).toFixed(1)+"%":"0%";return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="mono">'+r.visitors+'</td><td>'+r.pageviews+'</td><td>'+(r.bounce_rate||0).toFixed(0)+'%</td><td>'+(r.visit_duration_avg||0).toFixed(0)+'s</td><td class="gold">'+r.app_store_clicks+'</td><td class="green">'+cv+'</td></tr>'}).join('')+'</table>')+'</div>'}
function rCircles(){var cl=D.circles.circles||[];return'<div class="kg" style="margin-bottom:16px">'+kpi("Circles",D.circles.total,"#06b6d4")+kpi("Members",D.circles.total_members,"#6366f1")+kpi("Encouragements",D.circles.total_encouragements,"#14b8a6")+kpi("Requests",D.circles.total_prayer_requests,"#8b5cf6")+'</div><div class="cd"><h3>All Circles</h3>'+(cl.length===0?'<p style="color:#555;font-size:12px">No circles.</p>':'<table class="tbl"><tr><th>Name</th><th>Code</th><th>Members</th><th>Encouragements</th><th>Requests</th><th>Created</th></tr>'+cl.map(function(c){return'<tr><td><strong style="color:#e2e0d8">'+c.name+'</strong></td><td class="mono gold">'+c.code+'</td><td class="mono">'+c.members+'</td><td class="mono">'+c.encouragements+'</td><td class="mono">'+c.prayerRequests+'</td><td class="mono" style="color:#555">'+new Date(c.createdAt).toLocaleDateString()+'</td></tr>'}).join('')+'</table>')+'</div>'}
loadData();setInterval(loadData,5*60*1000);
</script>
</body>
</html>
