<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>prAmen — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#111118;--border:#1c1c26;--hover:#1a1a28;--gold:#C9A44A;--cream:#F5F0E6;--text:#d4d0c8;--muted:#5a5a68;--green:#22c55e;--red:#ef4444;--blue:#06b6d4;--pink:#ec4899;--purple:#8b5cf6;--orange:#f97316;--teal:#14b8a6;--indigo:#6366f1}
*{margin:0;padding:0;box-sizing:border-box}::selection{background:var(--gold);color:var(--bg)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:3px}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;padding:14px 18px;min-height:100vh}
.c{max-width:1360px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.hdr h1{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:-.3px}
.hdr .sub{color:var(--muted);font-size:10px;margin-top:2px;font-family:'JetBrains Mono'}
.live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;font-family:'DM Sans';transition:all .15s}
.tab:hover{color:var(--text);background:var(--card)}
.tab.active{border-color:var(--gold);background:rgba(201,164,74,.06);color:var(--gold)}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;transition:border-color .15s}
.k:hover{border-color:#2a2a38}
.k .l{font-size:8px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.k .v{font-size:22px;font-weight:700;font-family:'JetBrains Mono';letter-spacing:-.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.cd h3{font-size:10px;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tr{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:rgba(255,255,255,.02);border-radius:5px;margin-bottom:3px;transition:background .1s}
.tr:hover{background:rgba(255,255,255,.04)}
.tr .n{font-size:11px}.tr .ct{font-size:15px;font-weight:700;font-family:'JetBrains Mono'}
.tbl{width:100%;border-collapse:collapse;font-size:10px}
.tbl th{text-align:left;padding:6px 8px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text)}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono';font-size:10px}
.ug{display:grid;grid-template-columns:240px 1fr;gap:10px}
.ui{padding:6px 8px;border-radius:5px;margin-bottom:2px;cursor:pointer;background:rgba(255,255,255,.02);border:1px solid transparent;font-size:10px;transition:all .12s}
.ui:hover{border-color:var(--border);background:rgba(255,255,255,.03)}
.ui.ac{border-color:rgba(201,164,74,.25);background:rgba(201,164,74,.04)}
.ud{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px}
.uid{font-family:'JetBrains Mono';font-weight:500;font-size:9px}
.um{display:flex;gap:4px;font-size:7px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.el{max-height:520px;overflow-y:auto}
.ei{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02)}
.ed{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.en{font-size:11px;font-weight:500}
.et{font-size:8px;color:var(--muted);font-family:'JetBrains Mono'}
.tg{display:flex;gap:3px;margin-top:1px;flex-wrap:wrap}.tg span{font-size:8px}
.tf{background:rgba(34,197,94,.12);color:var(--green);padding:1px 4px;border-radius:3px;font-size:7px;font-weight:600}
.fs{margin-bottom:8px}
.fh{display:flex;justify-content:space-between;margin-bottom:3px;align-items:center}
.fn{width:18px;height:18px;border-radius:50%;background:rgba(201,164,74,.1);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-right:4px}
.fl{font-size:11px;font-weight:600}
.fc{font-size:14px;font-weight:700;color:var(--gold);font-family:'JetBrains Mono'}
.fd{font-size:9px;color:var(--red);margin-right:6px;font-weight:600}
.fba{height:22px;background:rgba(255,255,255,.03);border-radius:5px;overflow:hidden;position:relative}
.ff{height:100%;background:linear-gradient(90deg,var(--gold),#B8933D);border-radius:5px;transition:width .6s ease}
.fp{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:700;font-family:'JetBrains Mono'}
.br{margin-bottom:5px}
.br .bl{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px}
.br .bn{font-weight:500}
.br .bc{color:var(--muted);font-family:'JetBrains Mono';font-size:9px}
.bt{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px;transition:width .5s ease}
.loading{text-align:center;padding:60px;color:var(--muted);font-size:13px}
.err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--red);font-size:11px}
.note{background:rgba(201,164,74,.04);border:1px solid rgba(201,164,74,.12);border-radius:6px;padding:10px 14px;margin-bottom:10px;color:var(--gold);font-size:11px}
.hidden{display:none}
.rbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:9px;font-family:'DM Sans';font-weight:600;transition:all .15s}
.rbtn:hover{border-color:var(--gold);color:var(--gold)}
.asc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600}
.asc-ok{background:rgba(34,197,94,.1);color:var(--green)}
.asc-no{background:rgba(239,68,68,.1);color:var(--red)}
@media(max-width:900px){.kg{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.ug{grid-template-columns:1fr}}
@media(max-width:500px){.kg{grid-template-columns:1fr 1fr}.hdr{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="c">
  <div class="hdr">
    <div><h1>🙏 prAmen</h1><p class="sub" id="ts">Loading...</p></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="live"><span class="dot"></span>LIVE</div>
      <span id="asc-status" class="asc-badge asc-no">Apple: checking...</span>
      <button class="rbtn" onclick="loadAll()">↻ Refresh</button>
      <div class="tabs">
        <button class="tab active" onclick="go('overview',this)">Overview</button>
        <button class="tab" onclick="go('funnel',this)">Funnel</button>
        <button class="tab" onclick="go('users',this)">Users</button>
        <button class="tab" onclick="go('events',this)">Events</button>
        <button class="tab" onclick="go('revenue',this)">Revenue</button>
        <button class="tab" onclick="go('web',this)">Web</button>
        <button class="tab" onclick="go('circles',this)">Circles</button>
      </div>
    </div>
  </div>
  <div id="main" class="loading">Connecting to prAmen API...</div>
</div>
<script>
var B=location.origin,K=new URLSearchParams(location.search).get("key")||"",D=null,PH=null,AP=null,TAB="overview",SU=null;
var C={app_opened:"#6366f1",prayer_logged:"#f59e0b",paywall_viewed:"#ef4444",paywall_plan_selected:"#ec4899",onboarding_completed:"#22c55e",circle_created:"#06b6d4",circle_left:"#64748b",prayer_request_created:"#8b5cf6",share_tapped:"#14b8a6",scripture_viewed:"#a78bfa",circle_invite_accepted:"#06b6d4",circle_member_joined:"#22d3ee",encouragement_sent:"#14b8a6",user_signed_up:"#22c55e",account_deleted:"#ef4444",email_opt_in:"#34d399"};
var L={app_opened:"App Open",prayer_logged:"Prayer",paywall_viewed:"Paywall",paywall_plan_selected:"Plan Tap",onboarding_completed:"Onboarding",circle_created:"Circle +",circle_left:"Circle Left",prayer_request_created:"Request",share_tapped:"Share",scripture_viewed:"Scripture",circle_invite_accepted:"Invite ✓",circle_member_joined:"Member +",encouragement_sent:"Encourage",user_signed_up:"Signup",account_deleted:"Delete",email_opt_in:"Email Opt-in"};
function go(t,el){TAB=t;SU=null;document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});if(el)el.classList.add('active');render()}
function loadAll(){
  var p1=fetch(B+"/api/dashboard?key="+K).then(function(r){return r.json()});
  var p2=fetch(B+"/api/dashboard/events?key="+K+"&days=14&limit=500").then(function(r){return r.json()}).catch(function(){return null});
  var p3=fetch(B+"/api/dashboard/appstore?key="+K).then(function(r){return r.json()}).catch(function(){return null});
  Promise.all([p1,p2,p3]).then(function(r){
    D=r[0];PH=r[1];AP=r[2];
    document.getElementById("ts").textContent=new Date().toLocaleString()+" • "+((PH&&PH.total_events)||"?")+" events • "+((PH&&PH.total_users)||"?")+" users";
    var ab=document.getElementById("asc-status");
    if(AP&&AP.connected){ab.className="asc-badge asc-ok";ab.textContent="Apple: ✓ Connected"}
    else{ab.className="asc-badge asc-no";ab.textContent="Apple: ✗"}
    render();
  }).catch(function(e){document.getElementById("main").innerHTML='<div class="err">'+e.message+'</div>'});
}
function render(){if(!D)return;var el=document.getElementById("main");switch(TAB){case"overview":el.innerHTML=rOv();break;case"funnel":el.innerHTML=rFn();break;case"users":el.innerHTML=rUs();break;case"events":el.innerHTML=rEv();break;case"revenue":el.innerHTML=rRv();break;case"web":el.innerHTML=rWb();break;case"circles":el.innerHTML=rCr();break}}
function kpi(l,v,c){return'<div class="k"><div class="l">'+l+'</div><div class="v" style="color:'+c+'">'+v+'</div></div>'}
function row(n,v,c){return'<div class="tr"><span class="n">'+n+'</span><span class="ct" style="color:'+(c||'var(--gold)')+'">'+v+'</span></div>'}

function rOv(){var k=D.kpis,s=D.subscription_breakdown||{},ph=PH||{},f=ph.funnel||{};
  var totalPlanTaps=ph.plan_taps?ph.plan_taps.reduce(function(a,x){return a+x[1]},0):0;
  var convRate=f.paywall>0&&D.revenue.total_subscribers_30d>0?((D.revenue.total_subscribers_30d/f.paywall)*100).toFixed(1)+"%":"0%";
  return'<div class="kg">'+
    kpi("MRR (Net)","$"+(k.mrr_net||0).toFixed(2),"var(--gold)")+
    kpi("Total Users",ph.total_users||k.total_users,"var(--green)")+
    kpi("Active Subs",(s.active||0)+(s.lifetime||0),"var(--blue)")+
    kpi("Trials",s.trial||0,"var(--orange)")+
    kpi("Events (14d)",ph.total_events||"—","var(--indigo)")+
    kpi("Plan Taps",totalPlanTaps,"var(--pink)")+
    kpi("Paywall Conv.",convRate,"var(--red)")+
    kpi("Circles",k.active_circles,"var(--purple)")+
    kpi("Web (7d)",k.landing_visitors_7d,"var(--teal)")+
    kpi("Landing Conv.",k.landing_conversion,"var(--orange)")+
  '</div>'+
  '<div class="g3">'+
    '<div class="cd"><h3>Event Breakdown</h3>'+(ph.event_counts?ph.event_counts.slice(0,12).map(function(x){var mx=ph.event_counts[0][1];return'<div class="br"><div class="bl"><span class="bn" style="color:'+(C[x[0]]||'var(--muted)')+'">'+(L[x[0]]||x[0])+'</span><span class="bc">'+x[1]+'</span></div><div class="bt"><div class="bf" style="width:'+(x[1]/mx*100)+'%;background:'+(C[x[0]]||'var(--muted)')+'"></div></div></div>'}).join(''):'<div class="note">Connect PostHog personal API key</div>')+'</div>'+
    '<div class="cd"><h3>Prayer Topics</h3>'+(ph.prayer_topics?ph.prayer_topics.map(function(x){return row(x[0],x[1],"var(--orange)")}).join(''):"—")+'<h3 style="margin-top:14px">Plan Interest</h3>'+(ph.plan_taps?ph.plan_taps.map(function(x){return row(x[0],x[1],x[0]==="yearly"?"var(--green)":x[0]==="monthly"?"var(--indigo)":"var(--orange)")}).join(''):"—")+'</div>'+
    '<div class="cd"><h3>Status</h3>'+Object.entries(s).map(function(e){return row(e[0]||"none",e[1],e[0]==="active"?"var(--green)":e[0]==="trial"?"var(--orange)":"var(--muted)")}).join('')+'<h3 style="margin-top:14px">Circles</h3>'+row("Active",D.circles.total,"var(--blue)")+row("Members",D.circles.total_members,"var(--indigo)")+row("Encouragements",D.circles.total_encouragements,"var(--teal)")+'<h3 style="margin-top:14px">Apple</h3>'+(AP&&AP.connected?row("App",AP.app?.name||"prAmen","var(--green)")+row("Bundle",AP.app?.bundleId||"—","var(--muted)"):'<div class="note">Configure ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY</div>')+'</div>'+
  '</div>'}

function rFn(){if(!PH||!PH.funnel)return'<div class="err">PostHog not connected — add POSTHOG_PERSONAL_API_KEY to Railway</div>';
  var f=PH.funnel;
  var steps=[
    {l:"First Open",c:f.first_open,clr:"var(--green)"},
    {l:"Onboarding Done",c:f.onboarding,clr:"var(--blue)"},
    {l:"Paywall Viewed",c:f.paywall,clr:"var(--red)"},
    {l:"Plan Tapped",c:f.plan_tap,clr:"var(--pink)"},
    {l:"Signed Up (Auth)",c:f.signup,clr:"var(--indigo)"},
    {l:"First Prayer",c:f.prayer,clr:"var(--orange)"},
    {l:"Scripture Viewed",c:f.scripture,clr:"var(--purple)"},
    {l:"Circle Created",c:f.circle,clr:"var(--teal)"}
  ];
  var mx=steps[0].c||1;
  return'<div class="cd"><h3>Full Activation Funnel (14-day window)</h3>'+
    steps.map(function(s,i){var p=s.c/mx*100;var dr=i>0&&steps[i-1].c>0?Math.round((steps[i-1].c-s.c)/steps[i-1].c*100):null;
    return'<div class="fs"><div class="fh"><div><span class="fn">'+(i+1)+'</span><span class="fl">'+s.l+'</span></div><div>'+(dr!==null&&dr>0?'<span class="fd">-'+dr+'%</span>':'')+'<span class="fc">'+s.c+'</span></div></div><div class="fba"><div class="ff" style="width:'+p+'%;min-width:'+(s.c>0?12:0)+'px;background:'+s.clr+'"></div><span class="fp" style="color:'+(p>35?'var(--bg)':'var(--muted)')+'">'+Math.round(p)+'%</span></div></div>'}).join('')+
  '</div>'+
  '<div class="g2"><div class="cd"><h3>DAU Trend</h3>'+(PH.daily_dau?PH.daily_dau.slice(0,14).map(function(d){return row(d.date,d.dau,"var(--indigo)")}).join(''):"—")+'</div>'+
  '<div class="cd"><h3>Highest Intent Users</h3>'+(PH.users?PH.users.filter(function(u){return u.plan_taps>0}).map(function(u){return'<div class="tr"><span class="n"><span class="mono" style="color:var(--gold);cursor:pointer" onclick="filterUser(\''+u.full_id+'\')">'+u.id+'</span>'+(u.city?' <span style="font-size:8px;color:var(--muted)">📍'+u.city+'</span>':'')+'</span><span class="ct" style="color:var(--pink)">'+u.plan_taps+'</span></div>'}).join(''):"—")+'</div></div>'}

function filterUser(uid){SU=uid;TAB="users";document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');if(b.textContent==="Users")b.classList.add('active')});render()}

function rUs(){if(!PH||!PH.users)return'<div class="err">PostHog not connected</div>';
  var users=PH.users;var filtered=SU?PH.recent_events.filter(function(e){return e.full_user_id===SU}):PH.recent_events.slice(0,60);
  return'<div class="ug"><div class="cd" style="max-height:560px;overflow-y:auto"><h3>Users ('+users.length+')</h3>'+users.map(function(u){
    var has={pr:u.event_types.prayer_logged>0,ci:u.event_types.circle_created>0,pw:u.plan_taps>0,sc:u.event_types.scripture_viewed>0};
    return'<div class="ui'+(SU===u.full_id?' ac':'')+'" onclick="SU=SU===\''+u.full_id+'\'?null:\''+u.full_id+'\';render()"><div><span class="ud" style="background:var(--gold)"></span><span class="uid" style="color:var(--gold)">'+u.id+'</span></div><div class="um"><span>'+u.event_count+'ev</span>'+(has.pr?'<span>🙏</span>':'')+(has.ci?'<span>👥</span>':'')+(u.max_streak?'<span>🔥'+u.max_streak+'</span>':'')+(has.pw?'<span>💳'+u.plan_taps+'</span>':'')+(has.sc?'<span>📖</span>':'')+(u.city?'<span>📍'+u.city+'</span>':'')+'</div></div>'}).join('')+'</div>'+
  '<div class="cd"><h3>'+(SU?'Journey: '+SU.substring(0,8):'Recent Events')+'</h3>'+(SU?'<button class="rbtn" style="margin-bottom:8px" onclick="SU=null;render()">✕ Clear</button>':'')+
  '<div class="el">'+filtered.map(function(e){var pc={monthly:'var(--indigo)',yearly:'var(--green)',lifetime:'var(--orange)'};var t=new Date(e.timestamp);
    return'<div class="ei"><div class="ed" style="background:'+(C[e.event]||'var(--muted)')+'"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="en" style="color:'+(C[e.event]||'var(--text)')+'">'+(L[e.event]||e.event)+'</span><span class="et">'+t.toLocaleDateString()+' '+t.toLocaleTimeString()+'</span></div><div class="tg">'+((!SU)?'<span class="uid" style="color:var(--muted);cursor:pointer" onclick="filterUser(\''+e.full_user_id+'\')">'+e.user+'</span>':'')+(e.properties.is_first_open?'<span class="tf">FIRST</span>':'')+(e.properties.type?'<span style="color:var(--muted)">'+e.properties.type+'</span>':'')+(e.properties.plan?'<span style="color:'+(pc[e.properties.plan]||'var(--muted)')+'">'+e.properties.plan+(e.properties.price?' '+e.properties.price:'')+'</span>':'')+(e.properties.streak?'<span style="color:var(--green)">🔥'+e.properties.streak+'</span>':'')+(e.properties.city?'<span style="color:var(--muted)">📍'+e.properties.city+'</span>':'')+'</div></div></div>'}).join('')+'</div></div></div>'}

function rEv(){if(!PH)return'<div class="err">PostHog not connected</div>';
  var evs=PH.recent_events||[];return'<div class="cd"><h3>Event Stream ('+evs.length+' events, 14-day window)</h3><div class="el" style="max-height:600px">'+evs.map(function(e){var pc={monthly:'var(--indigo)',yearly:'var(--green)',lifetime:'var(--orange)'};var t=new Date(e.timestamp);
    return'<div class="ei"><div class="ed" style="background:'+(C[e.event]||'var(--muted)')+'"></div><div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="en" style="color:'+(C[e.event]||'var(--text)')+'">'+(L[e.event]||e.event)+'</span><span class="et">'+t.toLocaleDateString()+' '+t.toLocaleTimeString()+'</span></div><div class="tg"><span class="uid" style="color:var(--muted);cursor:pointer" onclick="filterUser(\''+e.full_user_id+'\')">'+e.user+'</span>'+(e.properties.is_first_open?'<span class="tf">FIRST</span>':'')+(e.properties.type?'<span style="color:var(--muted)">'+e.properties.type+'</span>':'')+(e.properties.plan?'<span style="color:'+(pc[e.properties.plan]||'var(--muted)')+'">'+e.properties.plan+(e.properties.price?' '+e.properties.price:'')+'</span>':'')+(e.properties.streak?'<span style="color:var(--green)">🔥'+e.properties.streak+'</span>':'')+(e.properties.city?'<span style="color:var(--muted)">📍'+e.properties.city+'</span>':'')+(e.properties.circle_name?'<span style="color:var(--blue)">'+e.properties.circle_name+'</span>':'')+'</div></div></div>'}).join('')+'</div></div>'}

function rRv(){var k=D.kpis,d=D.revenue.daily||[],ev=D.revenue.recent_events||[];
  return'<div class="kg">'+kpi("Gross (30d)","$"+(k.revenue_gross_30d||0).toFixed(2),"var(--orange)")+kpi("Net (30d)","$"+(k.revenue_net_30d||0).toFixed(2),"var(--gold)")+kpi("New Subs",D.revenue.total_subscribers_30d||0,"var(--green)")+kpi("Cancels",D.revenue.total_cancellations_30d||0,"var(--red)")+kpi("Apple Cut","15%","var(--muted)")+'</div>'+
  '<div class="cd"><h3>Daily Revenue</h3>'+(d.length?'<table class="tbl"><tr><th>Date</th><th>New</th><th>Renew</th><th>Cancel</th><th>Gross</th><th>Net</th></tr>'+d.map(function(r){return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td style="color:var(--green)">'+r.new_subscribers+'</td><td>'+r.renewals+'</td><td style="color:var(--red)">'+r.cancellations+'</td><td class="mono">$'+(r.revenue_gross||0).toFixed(2)+'</td><td class="mono" style="color:var(--gold)">$'+(r.revenue_net||0).toFixed(2)+'</td></tr>'}).join('')+'</table>':'<div class="note">Revenue data populates automatically when subscriptions flow through RevenueCat webhooks. Send a test event from RevenueCat to verify.</div>')+'</div>'+
  '<div class="cd"><h3>Transaction Log</h3>'+(ev.length?'<table class="tbl"><tr><th>Time</th><th>Event</th><th>Plan</th><th>Price</th><th>User</th></tr>'+ev.map(function(e){return'<tr><td class="mono">'+new Date(e.created_at).toLocaleString()+'</td><td>'+e.event_type+'</td><td>'+(e.plan||'—')+'</td><td class="mono" style="color:var(--gold)">$'+(e.price||0).toFixed(2)+'</td><td class="mono" style="color:var(--muted)">'+(e.user_id||'').substring(0,8)+'</td></tr>'}).join('')+'</table>':'<div class="note">No transactions yet.</div>')+'</div>'}

function rWb(){var d=D.web.daily||[];
  return'<div class="kg">'+kpi("Visitors (7d)",D.kpis.landing_visitors_7d,"var(--teal)")+kpi("App Store Clicks",D.kpis.landing_app_store_clicks_7d,"var(--gold)")+kpi("Conversion",D.kpis.landing_conversion,"var(--green)")+'</div>'+
  '<div class="cd"><h3>Daily Landing Page Metrics</h3>'+(d.length?'<table class="tbl"><tr><th>Date</th><th>Visitors</th><th>Views</th><th>Bounce</th><th>Duration</th><th>Clicks</th><th>Conv.</th></tr>'+d.map(function(r){var cv=r.visitors>0?((r.app_store_clicks/r.visitors)*100).toFixed(1)+"%":"—";return'<tr><td class="mono">'+r.date.split('T')[0]+'</td><td class="mono">'+r.visitors+'</td><td>'+r.pageviews+'</td><td>'+(r.bounce_rate||0).toFixed(0)+'%</td><td>'+(r.visit_duration_avg||0).toFixed(0)+'s</td><td style="color:var(--gold)">'+r.app_store_clicks+'</td><td style="color:var(--green)">'+cv+'</td></tr>'}).join('')+'</table>':'<div class="note">Plausible data loads hourly. Make sure PLAUSIBLE_API_KEY is set in Railway.</div>')+'</div>'}

function rCr(){var cl=D.circles.circles||[];
  return'<div class="kg">'+kpi("Circles",D.circles.total,"var(--blue)")+kpi("Members",D.circles.total_members,"var(--indigo)")+kpi("Encouragements",D.circles.total_encouragements,"var(--teal)")+kpi("Requests",D.circles.total_prayer_requests,"var(--purple)")+'</div>'+
  '<div class="cd"><h3>All Prayer Circles</h3>'+(cl.length?'<table class="tbl"><tr><th>Name</th><th>Code</th><th>Members</th><th>Enc.</th><th>Req.</th><th>Created</th></tr>'+cl.map(function(c){return'<tr><td><strong style="color:var(--text)">'+c.name+'</strong></td><td class="mono" style="color:var(--gold)">'+c.code+'</td><td class="mono">'+c.members+'</td><td class="mono">'+c.encouragements+'</td><td class="mono">'+c.prayerRequests+'</td><td class="mono" style="color:var(--muted)">'+new Date(c.createdAt).toLocaleDateString()+'</td></tr>'}).join('')+'</table>':'<div class="note">No active circles.</div>')+'</div>'}

loadAll();setInterval(loadAll,5*60*1000);
</script>
</body>
</html>
